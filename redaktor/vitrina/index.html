<title>Витрина — редактор</title>
<style>
:root{--bg:#121212;--card:#1e1c20;--card2:#2a2730;--ink:#f4f1f3;--ink2:#a9a3ab;--line:#34303a;--accent:#e91e8c;--accent2:#8b5cf6;--ok:#3ecf8e;--warn:#ffb020}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit}
.wrap{max-width:1100px;margin:0 auto;padding:calc(10px + env(safe-area-inset-top,0)) 16px calc(40px + env(safe-area-inset-bottom,0))}
.mk{background:linear-gradient(90deg,var(--accent),var(--accent2));color:#fff;font-size:12px;font-weight:700;border-radius:10px;padding:6px 10px;margin-bottom:12px;text-align:center}
header{display:flex;align-items:center;gap:10px;margin-bottom:6px}
header a{color:var(--accent);text-decoration:none;font-size:14px}

.lead{color:var(--ink2);font-size:13px;margin:0 0 14px}

.sh .ch{color:var(--ink2);transition:transform .2s}
.shelf.open .sh .ch{transform:rotate(90deg)}
.shelf.dim{opacity:.55}
.shelf.dim .sh{cursor:default}
.soon{font-size:11px;color:var(--ink2);border:1px solid var(--line);border-radius:10px;padding:2px 8px}
.body{padding:0 0 14px}
/* вкладки дней */
.days{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;padding:0 14px 12px}
.days button{border:1px solid var(--line);background:none;border-radius:22px;padding:8px 4px;white-space:nowrap;cursor:pointer;font-weight:600}
.days button span{display:inline-block;margin-left:6px;background:var(--card2);border-radius:10px;padding:0 7px;font-size:12px;color:var(--ink2);font-weight:700}
.days button.on{background:var(--accent);border-color:var(--accent);color:#fff}
.days button.on span{background:rgba(255,255,255,.25);color:#fff}
.meta{display:flex;justify-content:space-between;align-items:center;padding:0 14px 8px;font-size:12px;color:var(--ink2)}
.meta b{color:var(--ink)}
.addtop{white-space:nowrap;flex-shrink:0;border:0;background:var(--accent);color:#fff;border-radius:16px;padding:7px 14px;font-weight:700;font-size:13px;cursor:pointer}

.strip{display:flex;gap:10px;overflow-x:auto;padding:0 14px 6px;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch}
.strip::-webkit-scrollbar{display:none}
.rc{position:relative;flex-shrink:0;width:132px;aspect-ratio:9/16;border-radius:14px;overflow:hidden;background:var(--card2);scroll-snap-align:start;cursor:pointer;border:0;padding:0;text-align:left}

.rc img,.rc video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.rc .num{position:absolute;top:6px;left:8px;font-weight:800;font-size:15px;text-shadow:0 1px 4px #000}
.rc .tag{position:absolute;top:6px;right:34px;font-size:10px;font-weight:700;background:rgba(0,0,0,.55);border-radius:8px;padding:2px 6px}
.rc .tag.me{background:var(--accent)}
.rc .x{position:absolute;top:4px;right:4px;width:26px;height:26px;border-radius:13px;border:0;background:rgba(0,0,0,.6);color:#fff;font-size:15px;line-height:26px;text-align:center;cursor:pointer}
.rc .cap{position:absolute;inset:auto 0 0 0;padding:28px 8px 8px;background:linear-gradient(transparent,rgba(0,0,0,.85));font-size:12px;font-weight:700;line-height:1.2}
.rc .cap small{display:block;font-weight:400;color:#ddd;font-size:10px;margin-top:2px}
.rc .play{position:absolute;bottom:44px;right:8px;font-size:10px;background:rgba(0,0,0,.55);border-radius:8px;padding:2px 6px}
.add{flex-shrink:0;width:132px;aspect-ratio:9/16;border-radius:14px;border:2px dashed var(--line);background:none;color:var(--accent);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;cursor:pointer;font-weight:700;scroll-snap-align:start}

.add i{font-style:normal;font-size:34px;line-height:1}
.note{padding:8px 14px 0;font-size:12px;color:var(--ink2)}
.undo{margin:8px 14px 0;background:var(--card2);border-radius:12px;padding:8px 12px;font-size:13px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.undo button{border:0;background:none;color:var(--accent);font-weight:700;cursor:pointer}

/* категории */
.cg{display:flex;gap:8px;padding:0 14px 6px;overflow-x:auto;scroll-snap-type:x mandatory}
.cg::-webkit-scrollbar{display:none}
.ct{position:relative;flex-shrink:0;width:118px;scroll-snap-align:start;background:var(--card2);border:0;border-radius:14px;padding:10px 8px 8px;text-align:left;cursor:pointer;min-height:118px;display:flex;flex-direction:column;justify-content:flex-end}
.ct .emo{position:absolute;top:8px;right:8px;font-size:26px}
.ct b{line-height:1.15}
.ct b{font-size:14px}
.ct small{color:var(--ink2);font-size:12px}
.ct.off{opacity:.35}
.ct .pin{position:absolute;top:6px;left:8px;font-size:11px;color:var(--accent);font-weight:700}
.ct.lost{background:none;border:1px dashed var(--warn)}
.ct.lost b{color:var(--warn)}
.row2{display:grid;grid-template-columns:42px 1fr;column-gap:10px;row-gap:6px;padding:8px;border-bottom:1px solid var(--line)}
.row2 .ctr{grid-column:2;display:flex;gap:6px}
.row2 .ctr select{flex:1;max-width:none}

.row2 .tx{flex:1;min-width:0}
.row2 .tx b{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row2 .tx small{display:block;color:var(--ink2);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row2 .tx .pn{color:var(--accent);font-weight:700}
.mini{border:1px solid var(--line);background:none;border-radius:10px;height:34px;min-width:34px;padding:0 8px;cursor:pointer;font-size:13px;flex-shrink:0}
.mini.on{background:var(--accent);border-color:var(--accent);color:#fff}
.tbar{display:flex;gap:6px;flex-wrap:wrap;padding:8px 16px 4px}
.tbar button{border:1px solid var(--line);background:none;border-radius:16px;padding:6px 12px;font-size:13px;cursor:pointer}
.tbar .p{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:700}
select.mv{background:var(--card2);color:var(--ink);border:1px solid var(--line);border-radius:10px;height:34px;padding:0 6px;font:inherit;font-size:12px;max-width:112px}

.card .snd{position:absolute;bottom:12px;right:12px;z-index:2;border:0;background:rgba(0,0,0,.6);color:#fff;border-radius:16px;padding:6px 12px;font-size:13px;cursor:pointer}
.card .noreel{position:absolute;inset:auto 12px 12px 12px;background:rgba(0,0,0,.7);border-radius:12px;padding:8px 10px;font-size:12px;color:var(--warn)}
.card .info{padding:14px 16px calc(14px + env(safe-area-inset-bottom,0));background:var(--card)}

.card .info p{margin:0;color:var(--ink2);font-size:13px}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}

.b1{background:linear-gradient(90deg,var(--accent),var(--accent2));color:#fff}
.b2{background:var(--card2);color:var(--ink)}
.b3{background:none;border:1px solid var(--line)!important;color:var(--ink)}

.sheet-bg{position:fixed;inset:0;z-index:30;background:rgba(0,0,0,.6);display:flex;align-items:flex-end;justify-content:center}

.sheet{background:var(--card);width:100%;max-width:520px;max-height:88dvh;border-radius:20px 20px 0 0;display:flex;flex-direction:column}
@media (min-width:700px){.sheet{border-radius:20px}}
.sheet .top{padding:14px 16px 8px}
.sheet .top h3{margin:0 0 2px;font-size:17px}
.sheet .top p{margin:0;color:var(--ink2);font-size:13px}
.sheet input,.lst input{width:100%;margin-top:10px;border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:10px 12px;color:var(--ink);font:inherit}
.seg{display:flex;gap:6px;margin-top:8px}
.seg button{border:1px solid var(--line);background:none;border-radius:16px;padding:5px 10px;font-size:12px;cursor:pointer}
.seg button.on{background:var(--card2);border-color:var(--accent)}
.lst{overflow:auto;padding:0 8px calc(12px + env(safe-area-inset-bottom,0))}
.it{display:flex;align-items:center;gap:10px;padding:8px;border-radius:12px}
.it:hover{background:var(--card2)}
.it .th{width:46px;height:62px;border-radius:8px;object-fit:cover;background:var(--card2);flex-shrink:0;cursor:pointer}
.it .tx{flex:1;min-width:0;cursor:pointer}
.it .tx b{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.it .tx small{display:block;color:var(--ink2);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.it .tx .r{color:var(--ok)}
.it .tx .nr{color:var(--warn)}
.pl{width:38px;height:38px;border-radius:19px;border:0;background:var(--accent);color:#fff;font-size:22px;cursor:pointer;flex-shrink:0}
.pl.on{background:var(--ok)}
.bylink{border:1px dashed var(--accent);background:none;color:var(--accent);margin:0 16px 8px;border-radius:12px;padding:11px;font-weight:700;cursor:pointer}
.sheet .cl{border:0;background:none;color:var(--ink2);padding:12px;cursor:pointer;border-top:1px solid var(--line)}
.msg{background:var(--card);border-radius:16px;padding:18px}
.msg a{color:var(--accent)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0));background:#fff;color:#111;padding:10px 16px;border-radius:20px;font-size:14px;z-index:60;max-width:90vw;text-align:center}
</style>
</head>

const MANIFEST=[{"key": "m0", "title": "Euro Circus — цирковое шоу из Европы", "video": "https://afisha-kz-gpt.vercel.app/reels/euro-circus.mp4", "poster": "https://afisha-kz-gpt.vercel.app/reels/posters/euro-circus.webp", "kicker": "Цирк · Алматинский цирк", "date": "Сб и вс, 16:00 · до 29 нояб", "eventSlug": null, "href": "/events/euro-circus/"}, {"key": "m1", "title": "KALEO. Way Down We Go Tour", "video": "https://afisha-kz-gpt.vercel.app/reels/kaleo.mp4", "poster": "https://afisha-kz-gpt.vercel.app/reels/posters/kaleo.webp", "kicker": "Концерт · Halyk Arena", "date": "29 нояб, 19:00", "eventSlug": null, "href": "/events/kaleo-almaty/"}, {"key": "m2", "title": "Рафтинг на реке Чилик", "video": "https://afisha-kz-gpt.vercel.app/reels/rafting.mp4", "poster": "https://afisha-kz-gpt.vercel.app/reels/posters/rafting.webp", "kicker": "Активный отдых · 150 км от Алматы", "date": "Летом, по выходным", "eventSlug": null, "href": "/events/rafting-chilik/"}, {"key": "m3", "title": "Спектакль «Чарли Гордон»", "video": "https://afisha-kz-gpt.vercel.app/reels/today-theatre.mp4", "poster": "https://afisha-kz-gpt.vercel.app/reels/posters/today-theatre.webp", "kicker": null, "date": null, "eventSlug": "chyarli-gordan-ev-0359", "href": null}, {"key": "m4", "title": "Şeksiz Äuen — концерт современной музыки", "video": "https://afisha-kz-gpt.vercel.app/reels/today-contemporary-music.mp4", "poster": "https://afisha-kz-gpt.vercel.app/reels/posters/today-contemporary-music.webp", "kicker": "Концерт · British Council", "date": null, "eventSlug": null, "href": null}, {"key": "m5", "title": "Вечеринка «Сумерки»", "video": "https://afisha-kz-gpt.vercel.app/reels/today-sumerki.mp4", "poster": "https://afisha-kz-gpt.vercel.app/reels/posters/today-sumerki.webp", "kicker": null, "date": null, "eventSlug": "sumerki-novolunie-kino-ev-0554", "href": null}, {"key": "m6", "title": "Фестиваль тыквы", "video": "https://afisha-kz-gpt.vercel.app/reels/today-pumpkin.mp4", "poster": "https://afisha-kz-gpt.vercel.app/reels/posters/today-pumpkin.webp", "kicker": "Фестиваль · С семьёй", "date": null, "eventSlug": null, "href": null}, {"key": "m7", "title": "Андрей Съедин: куда сходить поесть", "video": "https://afisha-kz-gpt.vercel.app/reels/andrey-syedin-gourmet.mp4", "poster": "https://afisha-kz-gpt.vercel.app/reels/posters/andrey-syedin-gourmet.webp", "kicker": "Рекомендации Афиши · ГурмЭ", "date": null, "eventSlug": null, "href": null}, {"key": "m8", "title": "Кинофестиваль Spot", "video": "https://afisha-kz-gpt.vercel.app/reels/today-spot-film.mp4", "poster": "https://afisha-kz-gpt.vercel.app/reels/posters/today-spot-film.webp", "kicker": "Кино", "date": null, "eventSlug": null, "href": null}];
const LIMIT=10, DAY=864e5, OFF=5*3600e3;
const SHELVES=["Чем заняться?","Категории","Афиша рекомендует","Куда сходить?","Событие за Х тенге","Новые места в городе","Календарь событий","Журнал","Спецпроекты","Afisha Club","Настроение","Сложно выбрать?"];

const loc=d=>new Date(new Date(d).getTime()+OFF);
const WD=["Вс","Пн","Вт","Ср","Чт","Пт","Сб"],MS=["янв","фев","мар","апр","мая","июн","июл","авг","сент","окт","нояб","дек"];
const hm=d=>{const l=loc(d);return String(l.getUTCHours()).padStart(2,"0")+":"+String(l.getUTCMinutes()).padStart(2,"0")};
let ALL=[],EV=[],TABS=[],tab=0,open=true,STATE={},UNDO=null,openCat=false,CATSTATE=null,openRek=false,openKuda=false,KUDA=null,REK=null;

/* те же окна, что в приложении: Сегодня / Завтра / Выходные (в субботу — «На неделе») */
function buildTabs(){
 const nowL=new Date(Date.now()+OFF);const t0=new Date(Date.UTC(nowL.getUTCFullYear(),nowL.getUTCMonth(),nowL.getUTCDate())-OFF);
 const dow=nowL.getUTCDay();const off=dow===6?2:dow===0?6:6-dow;const len=dow===6?5:2;
 const w0=new Date(t0.getTime()+off*DAY),w1=new Date(w0.getTime()+len*DAY);
 const T1=new Date(t0.getTime()+DAY),T2=new Date(t0.getTime()+2*DAY);
 const inW=(e,a,b)=>{const d=new Date(e.date);return a===null?d<b:(d>=a&&d<b)};
 return [
  {key:"today",label:"Сегодня",from:t0,to:T1,list:EV.filter(e=>inW(e,null,T1))},
  {key:"tomorrow",label:"Завтра",from:T1,to:T2,list:EV.filter(e=>inW(e,T1,T2))},
  {key:"weekend",label:dow===6?"На неделе":"Выходные",from:w0,to:w1,list:EV.filter(e=>inW(e,w0,w1))}
 ];
}
/* что сейчас на полке — как в приложении: ручные (вы) первыми, потом ролики редакции, потом события с Reels (с фото раньше); убранное не показываем; максимум 10 */
function manifestCards(){return MANIFEST.filter(m=>!m.eventSlug&&m.title).map(m=>({key:manKey(m.video),kind:"reel",title:m.title,video:m.video,poster:m.poster,kicker:m.kicker||"Рекомендации Афиши",date:m.date||"",href:m.href?APP+m.href:null}))}
function buildShelf(i){
 const t=TABS[i],sc=t.key;
 const gone=new Set(LIVE.hides.filter(h=>h.shelf===CHEM&&(h.scope===sc||h.scope==="")).map(h=>h.key));
 const man=manifestCards();const manBy=new Map(man.map(m=>[m.key,m]));const evBy=new Map(ALL.map(e=>[e.slug,e]));
 const far=TABS[2].to;
 const mine=LIVE.picks.filter(p=>p.shelf===CHEM&&(p.scope===sc||p.scope==="")).flatMap(p=>{
  if(p.kind==="reel"){const c=manBy.get(p.key);return c?[{...c,manual:true,pickId:p.id}]:[]}
  const e=evBy.get(p.key);if(!e||!e.video)return [];
  if(p.scope===""){const d=new Date(e.date);const inT=i===0?d<t.to:(d>=t.from&&d<t.to);if(!inT&&d<far)return []}
  return [{...evCard(e),manual:true,pickId:p.id}]});
 const auto=[...man,...t.list.filter(e=>e.video).sort((a,b)=>(!!b.img)-(!!a.img)).map(evCard)];
 const out=[],seen=new Set();
 for(const x of [...mine,...auto]){if(seen.has(x.key)||gone.has(x.key))continue;seen.add(x.key);out.push(x)}
 return out.slice(0,LIMIT);
}

/* ── Категории = 14 категорий досуга из справочника базы. На главной — лента, которая листается ── */
const EMO={"culture-entertainment":"🎭","entertainment":"🎤","sport":"⚽","active-recreation-healthy-lifestyle":"🏔️","excursions-and-travel":"🧭","development-and-workshops":"🎨","wellness":"🧘","restaurants-and-cafes":"🍽️","bars-and-nightlife":"🍸","children":"🧸","entertaining-shopping":"🛍️","interest-clubs-and-hobbies":"♟️","country-recreation":"🌲","at-home-leisure":"🏠"};
let LC=[];const PL={};
const plural=(n,a,b,c)=>{const m=n%10,h=n%100;return m===1&&h!==11?a:m>=2&&m<=4&&(h<10||h>=20)?b:c};
const nEv=n=>n+" "+plural(n,"событие","события","событий"), nPl=n=>n+" "+plural(n,"место","места","мест");
/* состояние полки «Категории» — из базы: порядок/скрытие плиток, закреплённые и убранные */
const slugOf=id=>(LC.find(c=>c.id===id)||{}).slug, idOf=sl=>(LC.find(c=>c.slug===sl)||{}).id;
function tileState(shelf){
 const T=TILES.filter(t=>t.shelf===shelf);const pos=sl=>{const t=T.find(x=>x.key===sl);return t?t.position:1000+(LC.find(c=>c.slug===sl)||{}).sort};
 const base=shelf==="kuda"?LC.filter(c=>c.places>0):LC;
 return {order:[...base].sort((a,b)=>pos(a.slug)-pos(b.slug)).map(c=>c.id),hidden:new Set(T.filter(t=>t.hidden).map(t=>idOf(t.key)))};
}
async function saveTiles(shelf,S){const {error}=await sb.rpc("showcase_tiles_set",{p_shelf:shelf,p_order:S.order.map(slugOf),p_hidden:[...S.hidden].map(slugOf)});if(error){toast("Не сохранилось: "+error.message);return false}await loadLive();return true}
function catState(){
 if(CATSTATE)return CATSTATE;
 const T=tileState("kategorii");const pins={},out={},pickId={};
 for(const p of LIVE.picks.filter(p=>p.shelf==="kategorii")){const id=idOf(p.scope);(pins[id]||(pins[id]=[])).push(p.key);pickId[p.scope+"|"+p.key]=p.id}
 for(const h of LIVE.hides.filter(h=>h.shelf==="kategorii")){const id=idOf(h.scope);(out[id]||(out[id]=new Set())).add(h.key)}
 CATSTATE={...T,move:{},pins,out,pickId};
 return CATSTATE;
}
async function setCat(e,catId){const {error}=await sb.rpc("showcase_set_category",{p_kind:"event",p_ref:e.ref,p_cat:catId});if(error){toast("Не сохранилось: "+error.message);return false}e.cat=catId;CATSTATE=null;return true}
const catOf=e=>{const S=catState();return S.move[e.slug]||e.cat||null};
const lcById=id=>LC.find(c=>c.id===id);
function catList(id){
 const S=catState();const pins=S.pins[id]||[];const out=S.out[id]||new Set();
 const L=ALL.filter(e=>catOf(e)===id&&!out.has(e.slug)).sort((a,b)=>new Date(a.date)-new Date(b.date));
 return [...pins.map(s=>L.find(e=>e.slug===s)).filter(Boolean),...L.filter(e=>!pins.includes(e.slug))];
}

 </div><div class="note">Плитка без событий на главной выглядит пусто — скройте её или опустите в конец.</div></div>`:""}</section>`;

/* Полки страницы категории — как в приложении (lib/showcase/category-shelves.ts). Минимум на полке — 6 */
const SHELF_MIN=6;
const SHELF_CFG={"culture-entertainment":[
 ["Театр",["Театр"],["Театр","Драматический театр","Детский театр"]],
 ["Классическая музыка",["Классическая музыка"],["Концертный зал","Филармония"]],
 ["Народная музыка",["Этно и традиции"],[]],
 ["Опера и балет",["Опера и балет"],["Театр оперы и балета"]],
 ["Выставки и музеи",["Выставка искусства","Фотовыставка","Музей"],["Музей","Галерея","Выставочный центр","Арт-пространство"]],
 ["Литература и чтения",["Литература и чтения"],["Библиотека"]],
 ["Киноклубы и авторское кино",["Кино (фестивальное, авторское)"],["Кинотеатр","Киностудийный комплекс"]]]};
function shelfCounts(c,evs,ps,pins){
 const dirSh=(SHELF_CFG[c.slug]||c.dirs.map(d=>[d.replace(/\s*\(.*\)\s*$/,""),[d],[d]]));
 const kids=e=>["0+","3+","6+"].includes(String(e.age||"").trim());
 return [["⭐ Афиша рекомендует",pins.length],["Премьеры",evs.filter(e=>/премьер/i.test(e.title)).length],
  ...dirSh.map(([t,ds,ts])=>[t,evs.filter(e=>ds.includes(e.dir)).length+ps.filter(p=>ts.includes(p.type)).length]),
  ["С детьми",evs.filter(kids).length+ps.filter(p=>/детск/i.test(p.type||"")).length],["Бесплатно",evs.filter(e=>e.free).length]];
}
function openCatSheet(id){

  const dirs={};evs.forEach(e=>{const d=e.dir||"Без направления";dirs[d]=(dirs[d]||0)+1});

  body+=lostMode?"":`<div class="seg" style="padding:0 16px 8px"><button type="button" data-view="ev" class="${view==="ev"?"on":""}">События ${evs.length}</button><button type="button" data-view="pl" class="${view==="pl"?"on":""}">Места${PL[id]?" "+PL[id].length:""}</button></div>`;
  if(view==="ev"){
   body+=
   `${Object.keys(dirs).length>1?`<div class="seg" style="padding:0 16px;flex-wrap:wrap"><button type="button" data-d="" class="${!dir?"on":""}">Все ${evs.length}</button>${Object.entries(dirs).sort((a,b)=>b[1]-a[1]).map(([d,n])=>`<button type="button" data-d="${esc(d)}" class="${dir===d?"on":""}">${esc(d)} ${n}</button>`).join("")}</div>`:""}
   <div class="lst">${shown.length?shown.map(e=>{const pn=pins.includes(e.slug);const l=loc(e.date);return `<div class="row2">${e.poster||e.img?`<img class="th" src="${esc(e.poster||e.img)}" alt="" loading="lazy" data-v="${esc(e.slug)}">`:`<div class="th" data-v="${esc(e.slug)}"></div>`}<div class="tx" data-v="${esc(e.slug)}"><b>${esc(e.title)}</b><small>${pn?`<span class="pn">⭐ Афиша рекомендует · </span>`:""}${l.getUTCDate()} ${MS[l.getUTCMonth()]} · ${esc(e.dir||"направление не указано")}</small></div><div class="ctr">
    ${lostMode?"":`<button class="mini ${pn?"on":""}" type="button" data-pin="${esc(e.slug)}" aria-label="В «Афиша рекомендует»">⭐</button>`}
    <select class="mv" data-mv="${esc(e.slug)}"><option value="">${lostMode?"В какую категорию?":"Перенести в…"}</option>${opts()}</select>

  bg.querySelectorAll("[data-po]").forEach(el=>el.onclick=()=>{const p=all.find(z=>z.slug===el.dataset.po);if(p)openPlaceCard(p)});
  bg.querySelectorAll("[data-pp]").forEach(b=>b.onclick=()=>{const p=K.pins[id]||(K.pins[id]=[]);const sl=b.dataset.pp;const j=p.indexOf(sl);j>=0?p.splice(j,1):p.unshift(sl);toast(j>=0?"Откреплено":"Закреплено наверху");draw()});
  bg.querySelectorAll("[data-px]").forEach(b=>b.onclick=()=>{(K.out[id]||(K.out[id]=new Set())).add(b.dataset.px);toast("Убрано из «"+c.name+"»");draw()});
  bg.querySelectorAll("[data-pm]").forEach(sel=>sel.onchange=()=>{if(!sel.value)return;K.move[sel.dataset.pm]=sel.value;toast("Перенесено в «"+lcById(sel.value).name+"»");draw()});
  bg.querySelectorAll("[data-t]").forEach(b=>b.onclick=()=>{const t=b.dataset.t;
   if(t==="up"||t==="down"){const d=t==="up"?-1:1;[K.order[i],K.order[i+d]]=[K.order[i+d],K.order[i]];toast("Порядок изменён");draw();return}
   if(t==="hide"){K.hidden.has(id)?K.hidden.delete(id):K.hidden.add(id);toast(K.hidden.has(id)?"Плитка скрыта":"Плитка снова на главной");draw();return}
   if(t==="add")pickPlace(id,draw);
  });
 };
 bg.onclick=e=>{if(e.target===bg){bg.remove();render()}};
 draw();
}
function pickPlace(id,after){
 const c=lcById(id);let q="";
 const bg=document.createElement("div");bg.className="sheet-bg";bg.style.zIndex=35;
 bg.innerHTML=`<div class="sheet"><div class="top"><h3>Добавить в «${esc(c.name)}»</h3><p>Любое место из базы — встанет сюда закреплённым.</p><input type="search" id="aq" placeholder="Название места"></div><div class="lst" id="al"></div><button class="bylink" type="button">Нет в базе — добавить по ссылке 2ГИС или Instagram</button><button class="cl" type="button">Закрыть</button></div>`;
 document.body.appendChild(bg);
 const draw=async()=>{const el=bg.querySelector("#al");if(q.length<2){el.innerHTML=`<div class="it" style="color:var(--ink2);font-size:13px">Начните вводить название…</div>`;return}
  const {data}=await sb.rpc("showcase_search",{p_q:q,p_kind:"place"});const L=(data||[]).slice(0,30);
  el.innerHTML=L.length?L.map((x,i)=>`<div class="it">${x.img?`<img class="th" src="${esc(x.img)}" alt="" loading="lazy">`:`<div class="th"></div>`}<div class="tx"><b>${esc(x.title)}</b><small>${esc(x.sub||"")}</small></div><button class="pl" type="button" data-i="${i}">+</button></div>`).join(""):`<div class="msg">Ничего не нашлось.</div>`;
  el.querySelectorAll("[data-i]").forEach(b=>b.onclick=()=>{const x=L[Number(b.dataset.i)];const K=kudaState();const p=K.pins[id]||(K.pins[id]=[]);if(!p.includes(x.slug))p.unshift(x.slug);
   const list=PL[id]||(PL[id]=[]);if(!list.some(z=>z.slug===x.slug))list.unshift({ref:x.ref,slug:x.slug,title:x.title,img:x.img,type:(x.sub||"").split(" · ")[0]});
   toast("Добавлено в «"+c.name+"» и закреплено");b.classList.add("on");b.textContent="✓";after&&after()});
 };
 bg.querySelector("#aq").oninput=e=>{q=e.target.value.trim();clearTimeout(bg._t);bg._t=setTimeout(draw,300)};
 bg.querySelector(".bylink").onclick=()=>byLink(c.name);
 bg.querySelector(".cl").onclick=()=>bg.remove();
 draw();
}

function openPlaceCard(p){
 const ov=document.createElement("div");ov.className="ov";ov.style.zIndex=45;
 const href=APP+"/search/?q="+encodeURIComponent(p.title);
 ov.innerHTML=`<div class="card"><div class="media">${p.img?`<img src="${esc(p.img)}" alt="">`:`<div style="display:grid;place-items:center;height:100%;color:var(--ink2)">Нет фото</div>`}<button class="close" type="button" aria-label="Закрыть">×</button></div>
  <div class="info"><div class="k">${esc(p.type||"Место")}${p.district?" · "+esc(p.district):""}</div><h3>${esc(p.title)}</h3><p>${esc(p.address||"")}${p.rating?" · ★ "+p.rating:""}${p.ig?" · @"+esc(String(p.ig).replace(/^.*instagram\.com\//,"").replace(/\/$/,"")):""}</p>
  <div class="acts">${p.pid?`<a class="b1" href="${fixUrl("place",p.pid)}" target="_blank" rel="noopener" style="grid-column:1/-1">✎ Исправить карточку</a>`:""}<a class="b3" href="${href}" target="_blank" rel="noopener" style="grid-column:1/-1">Открыть в приложении</a></div>
  <p style="margin-top:10px;font-size:12px">«Исправить» открывает карточку в базе: название, тип, адрес, фото, Instagram, описание. Сохранили — в приложении обновится в течение часа.</p></div></div>`;
 document.body.appendChild(ov);
 ov.querySelector(".close").onclick=()=>ov.remove();ov.onclick=e=>{if(e.target===ov)ov.remove()};
}

async function start(){
 const {data:{session}}=await sb.auth.getSession();
 if(!session){app.innerHTML=`<div class="msg">Нужно войти — без пароля, по ссылке из письма.<br><br><a href="../../?next=redaktor/vitrina/">Войти</a> — после входа вернётесь сюда.</div>`;return}
 const {data,error}=await sb.rpc("showcase_events_window",{p_days:400});
 if(error){app.innerHTML=`<div class="msg">Не загрузилось: ${esc(error.message)}</div>`;return}
 await loadLive();ALL=data||[];LC=(await sb.rpc("showcase_leisure")).data||[];const lim=Date.now()+9*DAY;EV=ALL.filter(e=>new Date(e.date)<lim);TABS=buildTabs();render();
}
start().catch(e=>{app.innerHTML=`<div class="msg">Сервер не ответил. <a href="" onclick="location.reload();return false">Обновить</a></div>`});
</script>
