<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Охват мест: 2ГИС / Афиша — Афиша</title>
<style>
:root{--bg:#f6f4f5;--card:#fff;--ink:#1c1b1d;--ink2:#6b6870;--line:#e6e1e4;--accent:#c0127f;--soft:#fce4f3;--ok:#1e7a48}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
button{font:inherit}
.wrap{max-width:820px;margin:0 auto;padding:12px 16px 60px}
header{display:flex;align-items:center;gap:10px;padding:6px 0 8px}
header a{color:var(--accent);text-decoration:none;font-size:14px}
header h1{font-size:20px;margin:0;flex:1}
.hint{color:var(--ink2);font-size:13px;margin:0 0 12px}
.filters{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 12px}
.filters button{border:1px solid var(--line);background:var(--card);border-radius:20px;padding:5px 12px;cursor:pointer;font-size:13px}
.filters button.on{background:var(--soft);border-color:var(--accent);color:var(--accent)}
.c{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin:0 0 10px}
.c h3{margin:0;font-size:16px;display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.c h3 a{color:var(--accent);text-decoration:none;font-weight:600}
.c .k{color:var(--ink2);font-size:13px;margin:2px 0 6px}
.c .why{margin:0 0 6px}
.c .s{color:var(--ink2);font-size:12px;background:var(--bg);border-radius:10px;padding:8px;margin:6px 0;max-height:4.6em;overflow:hidden}
.acts{display:flex;gap:8px;margin-top:8px}
.acts button{flex:1;border:0;border-radius:10px;padding:10px;cursor:pointer;font-weight:600}
.yes{background:var(--accent);color:#fff}.no{background:var(--bg);color:var(--ink)}
.msg{background:var(--card);border-radius:16px;padding:18px}.msg a{color:var(--accent)}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:#1c1b1d;color:#fff;padding:10px 16px;border-radius:12px;font-size:14px}

table{width:100%;border-collapse:collapse;background:var(--card);border-radius:16px;overflow:hidden;border:1px solid var(--line)}
th,td{padding:9px 10px;text-align:left;border-bottom:1px solid var(--line);font-size:14px}
th{font-size:12px;color:var(--ink2);font-weight:600;background:var(--bg)}
td.n,th.n{text-align:right;white-space:nowrap}
tr.cat{cursor:pointer}tr.cat:hover{background:var(--soft)}
tr.sub td{font-size:13px;color:var(--ink2);background:#fbfafb}
tr.sub td:first-child{padding-left:24px}
.bar{height:6px;border-radius:3px;background:var(--line);margin-top:4px;min-width:60px}.bar i{display:block;height:6px;border-radius:3px;background:var(--accent)}
input.g{width:84px;padding:5px 6px;border:1px solid var(--line);border-radius:8px;font:inherit;text-align:right}
tfoot td{font-weight:600;background:var(--bg)}
</style>
</head>
<body>
<div class="wrap">
<header><a href="../">← Редактор</a><h1>Охват мест: план / факт</h1></header>
<p class="hint">План — сколько мест в 2ГИС по рубрикам наших категорий в Алматы (ориентир полноты). Факт — сколько мест у Афиши. Нажмите на категорию, чтобы увидеть рубрики и вписать число из 2ГИС.</p>
<div id="app"><div class="msg">Загружаю…</div></div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
const SUPA_URL="https://quzgkhzkrhdlyztzbgcc.supabase.co";
const SUPA_KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InF1emdraHprcmhkbHl6dHpiZ2NjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk2OTk1NzIsImV4cCI6MjEwNTI3NTU3Mn0.zA6OVgFkgUgXGwLTzgL9IdB7yMcRNJEIWWq-ZZGYACQ";
const sb=supabase.createClient(SUPA_URL,SUPA_KEY,{auth:{persistSession:true,autoRefreshToken:true}});
const app=document.getElementById("app");
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmt=n=>n==null?"—":Number(n).toLocaleString("ru-RU");
let L=[],open=new Set();
function toast(t){const d=document.createElement("div");d.className="toast";d.textContent=t;document.body.appendChild(d);setTimeout(()=>d.remove(),2200)}
function pct(f,p){return p?Math.round(f*100/p):null}
function render(){
 let tf=0,tp=0;
 const rows=L.map(x=>{tf+=x.fact||0;tp+=x.plan||0;const p=pct(x.fact,x.plan);
  let h='<tr class="cat" data-s="'+esc(x.cat_slug)+'"><td><b>'+esc(x.cat_name)+'</b>'+(p!=null?'<div class="bar"><i style="width:'+Math.min(100,p)+'%"></i></div>':'')+'</td><td class="n">'+fmt(x.plan)+'</td><td class="n">'+fmt(x.fact)+'</td><td class="n">'+(p==null?"—":p+"%")+'</td></tr>';
  if(open.has(x.cat_slug)) h+=(x.rubrics||[]).map(r=>'<tr class="sub"><td>'+esc(r.rubric)+(r.at?' · '+esc(r.at):'')+'</td><td class="n"><input class="g" type="number" min="0" inputmode="numeric" data-id="'+r.id+'" value="'+(r.gis??"")+'" placeholder="2ГИС"></td><td></td><td></td></tr>').join("")||'<tr class="sub"><td colspan="4">Мест в 2ГИС для этой категории нет</td></tr>';
  return h}).join("");
 app.innerHTML='<table><thead><tr><th>Категория</th><th class="n">План (2ГИС)</th><th class="n">Факт (Афиша)</th><th class="n">Охват</th></tr></thead><tbody>'+rows+'</tbody><tfoot><tr><td>Всего</td><td class="n">'+fmt(tp||null)+'</td><td class="n">'+fmt(tf)+'</td><td class="n">'+(tp?Math.round(tf*100/tp)+"%":"—")+'</td></tr></tfoot></table>';
 app.querySelectorAll("tr.cat").forEach(tr=>tr.onclick=()=>{const s=tr.dataset.s;open.has(s)?open.delete(s):open.add(s);render()});
 app.querySelectorAll("input.g").forEach(inp=>inp.onchange=async()=>{
  const v=inp.value===""?null:parseInt(inp.value,10);
  const {error}=await sb.rpc("coverage_set",{p_id:+inp.dataset.id,p_count:v});
  if(error){toast("Не сохранилось: "+error.message);return}
  toast("Сохранено");await load()});
}
async function load(){const {data,error}=await sb.rpc("coverage_report");if(error){app.innerHTML='<div class="msg">Не загрузилось: '+esc(error.message)+'</div>';return}L=data||[];render()}
async function start(){
 const {data:{session}}=await sb.auth.getSession();
 if(!session){app.innerHTML='<div class="msg">Нужно войти — без пароля, по ссылке из письма.<br><br><a href="../../?next=redaktor/ohvat/">Войти</a></div>';return}
 await load();
}
start();
</script>
</body>
</html>
