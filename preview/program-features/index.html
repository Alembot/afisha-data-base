<style>

:root[data-theme="dark"]{

  --ink:#F2EFEA; --ink2:#B4AFA8; --ink3:#86817A;

*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 Onest,system-ui,-apple-system,"Segoe UI",sans-serif;font-variant-numeric:tabular-nums}

main{flex:1;min-width:0;padding-block:28px 60px;padding-inline:clamp(16px,3.5vw,44px);display:flex;flex-direction:column;gap:22px}
.head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap}

.aiask{display:flex;gap:10px}.aiask input{flex:1;min-width:0;border:1px solid var(--line);border-radius:12px;padding:12px 14px;font:inherit;font-size:16px;background:var(--bg);color:var(--ink)}
.tile.sel{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}

.layers{display:flex;flex-direction:column;gap:14px}

.panel.big{display:flex;justify-content:space-between;align-items:stretch;gap:18px;flex-wrap:wrap}

.big .total{display:flex;flex-direction:column;align-items:flex-end;justify-content:center;gap:4px;margin-left:auto;text-align:right}

.eq{display:flex;flex-wrap:wrap;gap:8px 18px;align-items:baseline}

.srows{display:flex;flex-direction:column}
.srow{display:grid;grid-template-columns:14px minmax(0,1.3fr) minmax(0,1.2fr) auto;gap:10px;align-items:center;padding:9px 0;border-top:1px solid var(--line2)}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px}

@media(max-width:700px){.home-overview{grid-template-columns:1fr;gap:20px}.home-overview-part{padding-right:0}.home-overview-part+.home-overview-part{border-left:0;border-top:1px solid var(--line);padding:20px 0 0}}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px}

function svvCount(n){return Number.isSafeInteger(n)&&n>=0}
function svvText(x){return typeof x==='string'&&x.trim().length>0}
function svvTime(x){return svvText(x)&&Number.isFinite(Date.parse(x))}
function svvFreeze(x){if(x&&typeof x==='object'&&!Object.isFrozen(x)){Object.values(x).forEach(svvFreeze);Object.freeze(x)}return x}
function svvValidate(raw){
 const fail=()=>{throw Error('Неполный или противоречивый снимок витрины')};
 if(!raw||!svvText(raw.rule_version)||!['public_showcase','verified_public_subset'].includes(raw.scope)||!['complete','incomplete'].includes(raw.coverage)||!svvTime(raw.at)||!raw.public_totals||!['events','places'].every(k=>raw.public_totals[k]===null||svvCount(raw.public_totals[k]))||!Array.isArray(raw.rows)||!Array.isArray(raw.unresolved)||!Array.isArray(raw.warnings)||!svvTime(raw.source?.observed_at)||!(svvText(raw.source?.snapshot_id)||/^[a-f0-9]{64}$/i.test(raw.source?.sha256||'')))fail();
 const verifiedPublicUrl=(value,required=false)=>{if(value==null){if(required)fail();return null}if(!svvText(value))fail();let u;try{u=new URL(value)}catch{fail()}if(u.protocol!=='https:'||u.origin!=='https://afisha-kz-gpt.vercel.app'||u.username||u.password)fail();return value};
 const d=JSON.parse(JSON.stringify(raw)),ids=new Set(),identities=new Set(),canonicalKeys=new Set();
 for(const r of d.rows){
  if(!r||!['events','places'].includes(r.entity)||!svvText(r.title)||!Array.isArray(r.membership)||!r.membership.length||!r.membership.every(x=>x&&svvText(x.block)))fail();
  let identity;
  if(r.kind==='editorial'){
   if(r.id!==null||r.uuid!==null||!svvText(r.canonical_key))fail();
   r.public_url=verifiedPublicUrl(r.public_url,true);identity=r.entity+':editorial:'+r.canonical_key;
  }else{
   if(!svvText(r.id)||!svvText(r.uuid)||!svvText(r.slug))fail();
   const id=r.entity+':'+r.id;identity=r.entity+':uuid:'+r.uuid.toLowerCase();
   if(ids.has(id))fail();ids.add(id);
   // Only an exact rendered public href is evidence. Never derive routes from slugs.
   r.public_url=verifiedPublicUrl(r.public_url);
  }
  if(identities.has(identity))fail();identities.add(identity);
  if(r.canonical_key!==undefined){if(!svvText(r.canonical_key)||canonicalKeys.has(r.canonical_key))fail();canonicalKeys.add(r.canonical_key)}
  if(r.physical_identity!==undefined){const v=r.physical_identity;if(r.entity!=='places'||r.kind!=='editorial'||!v||!svvText(v.address)||!svvText(v.phone)||!svvTime(v.verified_at)||!Array.isArray(v.proof_urls)||!v.proof_urls.length||v.proof_urls.length>10||!v.proof_urls.every(value=>{try{const u=new URL(value);return u.protocol==='https:'&&!u.username&&!u.password}catch{return false}}))fail();}
  if(r.moods!==undefined&&(!Array.isArray(r.moods)||!r.moods.every(x=>typeof x==='string')))fail();
  if(r.sessions!==undefined&&!Array.isArray(r.sessions))fail();
 }
 if(d.entity_coverage!==undefined&&(!d.entity_coverage||!['events','places'].every(k=>['complete','incomplete'].includes(d.entity_coverage[k]))))fail();
 const rowsByEntity={events:d.rows.filter(r=>r.entity==='events'),places:d.rows.filter(r=>r.entity==='places')};
 const subset={events:rowsByEntity.events.length,places:rowsByEntity.places.length};
 if(d.verified_subset!==undefined&&(!d.verified_subset||!['events','places'].every(k=>svvCount(d.verified_subset[k])&&d.verified_subset[k]===subset[k])))fail();
 if(d.blockers!==undefined&&!Array.isArray(d.blockers))fail();
 const totals={events:null,places:null},coverage={events:'incomplete',places:'incomplete'};
 for(const entity of ['events','places']){
  const complete=d.scope==='public_showcase'&&(d.entity_coverage?.[entity]||d.coverage)==='complete';
  const unresolved=[...d.unresolved,...(d.blockers||[])].some(x=>!x||typeof x!=='object'||!['events','places'].includes(x.entity)||x.entity===entity);
  if(complete&&unresolved)fail();
  if(complete&&d.public_totals[entity]!==null){
   if(d.public_totals[entity]!==rowsByEntity[entity].length)fail();
   totals[entity]=d.public_totals[entity];coverage[entity]='complete';
  }
 }
 return svvFreeze({...d,rowsByEntity,verified_subset:subset,verified_totals:totals,verified_coverage:coverage,identity:d.source.snapshot_id||d.source.sha256});
}

function loadVisibleSnapshot(force=false){
 if(AUTH_LOCKED||!AUTH_ID)return Promise.resolve(null);
 if(SVV.promise)return SVV.promise; // Explicit refresh clicks coalesce too.
 if(!force&&SVV.data)return Promise.resolve(SVV.data);
 const seq=++SVV.seq,epoch=AUTH_EPOCH,user=AUTH_ID;
 const current=()=>seq===SVV.seq&&epoch===AUTH_EPOCH&&user===AUTH_ID&&!AUTH_LOCKED;
 SVV.busy=true;SVV.error=null;
 const pending=Promise.resolve().then(()=>current()?svVisibleRead():null).then(d=>{if(current()&&d){
  const losesCoverage=SVV.data&&SVV.data.rule_version===d.rule_version&&['events','places'].some(k=>SVV.data.verified_coverage[k]==='complete'&&d.verified_coverage[k]!=='complete');
  if(losesCoverage){SVV.error=Error('Полноту нового снимка подтвердить не удалось');return null}
  SVV.data=d;SVV.receivedAt=Date.now();svVisibleAgeTick();
 }return current()?d:null}).catch(e=>{if(current())SVV.error=e;return null}).finally(()=>{if(current()){SVV.busy=false;SVV.promise=null;if(['home','showcase'].includes(S.view))render()}});
 SVV.promise=pending;
 if(['home','showcase'].includes(S.view))render();
 return pending;
}
function svVisibleAge(){
 const minutes=Math.floor(Math.max(0,Date.now()-SVV.receivedAt)/60000);
 const quantity=(n,one,few,many)=>n+' '+(n%10===1&&n%100!==11?one:n%10>=2&&n%10<=4&&(n%100<12||n%100>14)?few:many);
 if(minutes<1)return 'только что';
 if(minutes<60)return quantity(minutes,'минуту','минуты','минут')+' назад';
 const hours=Math.floor(minutes/60);
 return hours<24?quantity(hours,'час','часа','часов')+' назад':quantity(Math.floor(hours/24),'день','дня','дней')+' назад';
}
function svVisibleAgeTick(){

 if(['home','showcase'].includes(S.view)){const age=document.querySelector('[data-svv-age]');if(age)age.textContent=svVisibleAge()}

 const status=SVV.error?'Обновление не удалось подтвердить полностью. Показан последний подтверждённый снимок, актуальность не подтверждена.':SVV.busy?'Обновляю. Пока показан предыдущий подтверждённый снимок.':'Сохранённый снимок. Данные обновляются только по кнопке «Обновить».';
 return `<div class="note${SVV.error?'':'2'}" data-svv-freshness="${state}" role="${SVV.error?'alert':'status'}">${status} Последняя успешная загрузка: <span data-svv-age="1">${esc(svVisibleAge())}</span> (${esc(dtf(new Date(SVV.receivedAt).toISOString()))}).${SVV.error?'<button class="btn" data-svvrefresh="1">Повторить проверку</button>':''}</div>`;
}

 if(SVV.error&&!d)return '<section class="panel" data-svv-panel="error">'+title+'<div class="note" role="alert">Не удалось получить подтверждённый снимок. Итоги неизвестны, это не ноль. Числа каталога ниже не заменяют состав витрины.</div><button class="btn" data-svvrefresh="1">Повторить проверку</button></section>';

/* Read-only public catalog inspection. No publication flags or collector actions. */
let SV={data:null,error:null,busy:false,seq:0,period:'all',date:''};
let SVL={data:null,error:null,busy:false,seq:0,params:{entity:'events',offset:0,limit:50},title:'',mode:'inventory',snapshot:null,subset:false};
let SVD=null,SVDseq=0;
const SV_PERIODS={all:'Всё',today:'Сегодня',tomorrow:'Завтра',weekend:'Выходные',date:'Выбрать дату'};
function svCount(n){return Number.isSafeInteger(n)&&n>=0?nf(n):'—'}
function svError(){return '<div class="note">Не удалось получить данные. Счётчики неизвестны, это не ноль.</div>'}
function svTile(title,count,attrs,sub=''){return `<button class="tile" ${attrs}><span class="v">${svCount(count)}</span><span class="t">${esc(title)}</span>${sub?`<span class="s">${esc(sub)}</span>`:''}</button>`}
async function loadShowcase(){const seq=++SV.seq;SV.busy=true;SV.error=null;SV.data=null;if(S.view==='showcase')render();try{const r=await svSummaryRead();if(seq!==SV.seq)return;if(!r||!r.inventory)throw Error('Invalid showcase summary');SV.data=r}catch(e){if(seq===SV.seq)SV.error=e}finally{if(seq===SV.seq){SV.busy=false;if(S.view==='showcase')render()}}}
function svPeriodControls(){return `<div class="row" style="margin:14px 0">${Object.entries(SV_PERIODS).map(([k,label])=>`<button class="chip${SV.period===k?' on':''}" data-svperiod="${k}">${label}${k!=='date'?' · '+svCount(k==='all'?SV.data?.inventory.events:(SV.data?.periods||[]).find(x=>x.key===k)?.count):''}</button>`).join('')}${SV.period==='date'?`<label class="f"><span class="lbl">Дата · Алматы</span><input id="sv-date" type="date" value="${esc(SV.date)}"></label>`:''}</div>`}
function showcase(){if(!SV.data&&!SV.busy&&!SV.error&&!(SV.period==='date'&&!SV.date)){SV.busy=true;setTimeout(loadShowcase,0)}const d=SV.data;
 const actual=svVisiblePanel();
 const head=`<button class="back" data-go="home">← Главная</button><div class="head"><div><h1>Витрина</h1><div class="sub">Публичная витрина и отдельный каталог базы</div></div><button class="btn" data-svrefresh="1"${SV.busy?' disabled':''}>${SV.busy?'Обновляю…':'Обновить'}</button></div>`;
 if(SV.period==='date'&&!SV.date)return head+actual+svPeriodControls()+'<div class="note">Выберите дату для просмотра каталога событий.</div>';
 if(!d)return head+actual+(SV.error?svError()+'<button class="btn" data-svrefresh="1">Повторить</button>':'<div class="empty" role="status">Загружаю витрину…</div>');
 return head+actual+(SV.error?svError():'')+`
 <section class="panel"><h2>Каталог базы · не фактическая витрина</h2><div class="tiles" style="grid-template-columns:repeat(2,minmax(0,1fr));margin-top:14px">${svTile('События',d.inventory.events,'data-svlist="events"','Все актуальные записи публичного запроса')}${svTile('Места',d.inventory.places,'data-svlist="places"','Записи публичного запроса мест')}</div><div class="note2">${esc(d.inventory.label||'Не равно числу карточек, показанных на главной приложения.')}</div></section>
 <section class="panel"><h2>Каталог: события по датам и категориям</h2>${svPeriodControls()}<button class="btn" data-svselected="1">События выбранного периода · ${svCount(d.selected?.inventory_events)}</button><div class="note2">Точные даты сеансов · Алматы. Подстановка событий других дат не применяется.</div><div class="tiles" style="margin-top:14px">${(d.categories||[]).map(x=>svTile(x.name,x.count,`data-svcat="${esc(x.name)}"`)).join('')}</div></section>
 <section class="panel"><h2>Афиша рекомендует</h2><div class="note2">Редакционные подборки. Их точный состав пока не связан с карточками базы.</div><div class="tiles" style="margin-top:14px">${(d.recommendations||[]).map((x,i)=>svTile(x.name,null,`data-sveditorial="recommendations:${i}"`,'Состав не подтверждён')).join('')}</div></section>
 <section class="panel"><h2>Каталог: куда сходить</h2><div class="note2">${d.groups.length} групп действующего справочника. Каталог мест не зависит от выбранной даты события.</div><div class="tiles" style="margin-top:14px">${(d.groups||[]).map(x=>svTile(x.name,x.count,`data-svgroup="${esc(x.name)}"`)).join('')}</div></section>
 <section class="panel"><h2>Новые места <span class="pill">${(d.editorial||[]).length}</span></h2><div class="note2">Редакционные карточки приложения. Дата открытия и связь с карточками базы не подтверждены.</div><div class="tiles" style="margin-top:14px">${(d.editorial||[]).map((x,i)=>svTile(x.name,null,`data-sveditorial="editorial:${i}"`,x.type||'Редакционная карточка')).join('')}</div></section>
 <section class="panel"><h2>Каталог: по настроению</h2><div class="note2">${d.moods.length} настроений · события выбранного периода. Одна карточка может входить в несколько настроений.</div><div class="tiles" style="margin-top:14px">${(d.moods||[]).map(x=>`<button class="tile" data-svmood="${esc(x.code)}"><span class="t">${esc(x.name)}</span><span class="pill" style="align-self:flex-end;margin-top:auto;background:#ffe4ed;color:#b72057">${svCount(x.count)}</span></button>`).join('')}</div></section>
 <section class="panel"><div class="row"><h2>Продюсерские проекты</h2><span class="pill warn">${d.demo.length} проекта · Демо</span></div><div class="tiles" style="margin-top:14px">${(d.demo||[]).map((x,i)=>`<button class="tile" data-sveditorial="demo:${i}"><span class="t">${esc(x.name)}</span><span class="pill warn">Демо</span></button>`).join('')}</div><div class="note2">Не входят в фактические счётчики событий. Проведение и доступность покупки не подтверждены.</div></section>
 <details class="panel"><summary>Расхождения с публичным приложением</summary>${(d.warnings||[]).map(x=>`<p>${esc(typeof x==='string'?x:x.message||x.label)}</p>`).join('')}<p>Административный флаг «На витрине» не определяет состав публичных запросов. Редакционные карточки и каталог учитываются отдельно. Публичная главная может обслуживаться из кеша.</p></details>`;
}
function svParams(entity,extra={}){return {entity,period:entity==='events'?SV.period:'all',...(entity==='events'&&SV.period==='date'?{date:SV.date}:{}),offset:0,limit:50,...extra}}
function openShowcaseList(entity,extra={},title=''){if(entity==='events'&&(extra.period||SV.period)==='date'&&!SV.date){toast('Выберите дату');return}if(go('showcaseList')===false)return;SVL.mode='inventory';SVL.snapshot=null;SVL.subset=false;SVL.params=svParams(entity,extra);SVL.title=title||({events:'События каталога',places:'Места каталога'}[entity]);SVL.data=null;SVL.error=null;loadShowcaseList()}
async function loadShowcaseList(){if(SVL.mode==='visible'){loadVisibleList();return}const seq=++SVL.seq;SVL.busy=true;SVL.error=null;SVL.data=null;if(S.view==='showcaseList')render();try{const r=await svRegistryRead({...SVL.params});if(seq!==SVL.seq)return;if(!r||!Array.isArray(r.rows)||!Number.isSafeInteger(r.total)||r.total<0)throw Error('Invalid showcase registry');SVL.data=r}catch(e){if(seq===SVL.seq)SVL.error=e}finally{if(seq===SVL.seq){SVL.busy=false;if(S.view==='showcaseList')render()}}}
function showcaseList(){if(SVL.mode==='visible')return visibleShowcaseList();const d=SVL.data,p=SVL.params;return `<button class="back" data-go="showcase">← Витрина</button><div class="head"><div><h1>${esc(SVL.title)}</h1><div class="sub">${p.entity==='events'?esc(SV_PERIODS[p.period]||p.period)+(p.date?' · '+esc(p.date):'')+' · Алматы':'Места · все даты'}</div></div></div>${SVL.busy?'<div class="empty">Загружаю список…</div>':SVL.error?svError()+'<button class="btn" data-svretry="1">Повторить</button>':d?`<div class="note2">${esc(d.scope_label||'Каталог публичных запросов, не состав всех полок приложения')}${d.at?' · '+dtf(d.at):''} · список пересчитан при открытии</div><div class="lbl">${nf(d.total)} карточек</div><div class="tablewrap"><table><thead><tr><th>Название</th><th>ID</th><th>Категория</th></tr></thead><tbody>${d.rows.map((r,i)=>`<tr><td><button class="lnk" data-svrow="${i}"><b>${esc(r.title||r.name||'Без названия')}</b></button></td><td>${esc(r.id)}</td><td>${esc(r.cat||r.category||'—')}</td></tr>`).join('')||'<tr><td colspan="3">В этой выборке карточек нет.</td></tr>'}</tbody></table></div><div class="row"><button class="btn" data-svpage="prev"${p.offset===0?' disabled':''}>← Назад</button><span class="note2">${d.total?p.offset+1:0}–${Math.min(p.offset+d.rows.length,d.total)} из ${nf(d.total)}</span><button class="btn" data-svpage="next"${p.offset+d.rows.length>=d.total?' disabled':''}>Далее →</button></div>`:''}`}
function svExternal(url,label){const safe=qSafeUrl(url);return safe?`<a href="${esc(safe)}" target="_blank" rel="noopener noreferrer">${esc(label)}</a>`:'—'}
function showcaseDetail(){const x=SVD;if(x?.kind==='visibleEditorial')return visibleEditorialDetail(x);if(x?.kind==='catalog')return showcaseCatalogDetail(x);if(!x)return '<button class="back" data-go="showcase">← Витрина</button>';return `<button class="back" data-go="showcase">← Витрина</button><section class="panel"><div class="lbl">${esc(x.kind==='demo'?'Демо · продюсерский проект':x.kind==='editorial'?'Редакционная карточка':'Редакционная подборка')}</div><h1>${esc(x.name)}</h1><p>${esc(x.kind==='demo'?'Демонстрационный проект. Не входит в фактические счётчики. Проведение и доступность покупки не подтверждены.':x.kind==='editorial'?'Карточка опубликована в редакционном блоке «Новые места». Связь с записью базы и дата открытия не подтверждены.':'Точный список участников подборки и их количество не подтверждены. Число в названии не является проверенным количеством карточек.')}</p>${svExternal(x.public_url,'Открыть в приложении ↗')}</section>`}
document.addEventListener('click',ev=>{let t;if(t=ev.target.closest('[data-svopen]')){if(go('showcase')!==false&&!SV.data&&!SV.busy)loadShowcase();return}if(ev.target.closest('[data-svrefresh]')){loadVisibleSnapshot(true);loadShowcase();return}if(t=ev.target.closest('[data-svperiod]')){SV.period=t.dataset.svperiod;if(SV.period==='date'&&!SV.date){SV.seq++;SV.busy=false;SV.data=null;render();return}loadShowcase();return}if(t=ev.target.closest('[data-svlist]')){openShowcaseList(t.dataset.svlist,{period:'all',date:undefined});return}if(ev.target.closest('[data-svselected]')){openShowcaseList('events',{},'События выбранного периода');return}if(t=ev.target.closest('[data-svcat]')){openShowcaseList('events',{cat:t.dataset.svcat},t.dataset.svcat);return}if(t=ev.target.closest('[data-svgroup]')){openShowcaseList('places',{place_group:t.dataset.svgroup},t.dataset.svgroup);return}if(t=ev.target.closest('[data-svmood]')){openShowcaseList('events',{mood:t.dataset.svmood},(SV.data?.moods||[]).find(x=>x.code===t.dataset.svmood)?.name||'По настроению');return}if(t=ev.target.closest('[data-sveditorial]')){const [kind,n]=t.dataset.sveditorial.split(':');const x=SV.data?.[kind]?.[Number(n)];if(x&&go('showcaseDetail')!==false){SVDseq++;SVD={...x,kind};render()}return}if(ev.target.closest('[data-svretry]')){loadShowcaseList();return}if(t=ev.target.closest('[data-svpage]')){SVL.params.offset=Math.max(0,SVL.params.offset+(t.dataset.svpage==='next'?50:-50));loadShowcaseList();return}if(t=ev.target.closest('[data-svrow]')){const x=SVL.data?.rows[Number(t.dataset.svrow)];if(x)openShowcaseCard(x,SVL.params.entity);return}});
document.addEventListener('change',ev=>{if(ev.target.id==='sv-date'){SV.date=ev.target.value;if(SV.date)loadShowcase();else{SV.seq++;SV.busy=false;SV.data=null;render()}}});

async function openShowcaseCard(row,entity){if(row.kind==='editorial'){openVisibleEditorial(row,entity);return}if(go('showcaseDetail')===false)return;const seq=++SVDseq;SVD={kind:'catalog',row,entity,busy:true};render();try{const card=await apiCall(entity==='places'?'places_card':'events_card',{p_id:row.id});if(seq===SVDseq){if(!card||card.id!==row.id)throw Error('Wrong card');SVD={kind:'catalog',row,entity,card}}}catch(e){if(seq===SVDseq)SVD={kind:'catalog',row,entity,error:true}}finally{if(seq===SVDseq&&S.view==='showcaseDetail')render()}}
function showcaseCatalogDetail(x){const c=x.card;const head='<button class="back" data-go="showcaseList">← К выбранному списку</button>'+svVisibleDetailNote();if(x.busy)return head+'<div class="empty">Загружаю карточку…</div>';if(x.error)return head+svError()+'<button class="btn" data-svdetailretry="1">Повторить</button>';if(!c)return head;const place=x.entity==='places';const fields=place?{'Тип':c.type,'Категория':c.cat,'Адрес':c.addr,'Район':c.district,'Статус':c.status}:{'Тип':c.type,'Категория':c.cat,'Возраст':c.age,'Язык':c.language,'Цена от':c.price_from,'Цена до':c.price_to,'Статус':c.status};return head+`<section class="panel"><div class="lbl">${place?'Место':'Событие'} · ${esc(c.id)} · просмотр</div><h1>${esc(c.title||c.name||x.row.title)}</h1><div class="fields">${Object.entries(fields).map(([label,val])=>`<div class="f"><span class="lbl">${esc(label)}</span><span>${esc(val==null||val===''?'Не определено':val)}</span></div>`).join('')}</div>${c.descr||c.spec?`<p style="white-space:pre-wrap">${esc(c.descr||c.spec)}</p>`:''}${Array.isArray(c.dates)&&c.dates.length?`<h2>Даты</h2><p>${c.dates.map(d=>esc(d.at?dtf(d.at):'Дата не определена')).join('<br>')}</p>`:''}${x.row.public_url?svExternal(x.row.public_url,'Карточка в приложении ↗'):''}<div style="margin-top:12px">${svExternal(c.url||c.site||c.social,'Первоисточник ↗')}</div></section>`}
document.addEventListener('click',ev=>{if(ev.target.closest('[data-svdetailretry]')&&SVD?.row)openShowcaseCard(SVD.row,SVD.entity)});

 if(HS&&!SVV.data&&!SVV.busy&&!SVV.error)loadVisibleSnapshot();
 const head=`<div class="head"><div><div class="lbl">Алматы${HS?` · данные на ${dtf(HS.at)}`:''}</div><h1>Главная</h1></div><div class="row"><button class="btn" data-home-refresh="1"${HSbusy||SVV.busy?' disabled':''}>${HSbusy||SVV.busy?'Обновляю…':'Обновить'}</button><button class="btn pri aibtn" data-aiopen="1" aria-expanded="${AI.open}">✦ Ассистент базы</button></div></div>${AI.open?aiPanel():''}`;
 if(!HS)return head+(HSerr?hApiError()+`<button class="btn" data-home-refresh="1">Повторить</button>`:'<div class="empty" role="status">Загружаю состояние базы…</div>');
 const f=HS.funnel||{},c=HS.calendar||{},sh=SVV.data?.verified_totals||{};

 const windows=Object.keys(HOME_PERIODS).map(k=>hLink(c[k],HOME_PERIODS[k],`data-hperiod="${k}"`,c.labels&&c.labels[k]||'')).join('');
 const health=Array.isArray(HS.health)?HS.health:[];

 <section><div class="row" style="justify-content:space-between;margin-bottom:10px"><h2>События по датам</h2><span class="note2">без кино · фильмов в прокате: ${hCount(c.films)}</span></div><div class="tiles">${windows}</div></section>

}

function hListParams(){const f=HLFunnel||{};return {...HL,at:HS&&HS.at,from:f.from,to:f.to,limit:50}}
async function loadHomeList(){const seq=++HLseq;HLbusy=true;HLerr=null;HLdata=null;if(S.view==='homeList')render();try{const r=await homeListRead(hListParams());if(seq!==HLseq)return;if(!r||!Array.isArray(r.rows)||!Number.isSafeInteger(r.total))throw Error('invalid registry');HLdata=r}catch(e){if(seq===HLseq)HLerr=e}finally{if(seq===HLseq){HLbusy=false;if(S.view==='homeList')render()}}}
function openHomeList(p){HL={entity:'events',quality:false,period:'',cat:'',bucket:'',offset:0,...p};HLFunnel=HL.bucket&&HS?HS.funnel:null;HLdata=null;HLerr=null;S.homeReturn=null;if(go('homeList')!==false)loadHomeList()}
function homeList(){const d=HLdata,rows=d&&d.rows||[];const tabs=!HL.bucket&&!HL.period?`<div class="seg">${Object.entries(HOME_TYPES).map(([k,t])=>`<button data-htype="${k}" class="${HL.entity===k?'on':''}">${t} · ${hCount(HS&&(HL.quality?HS.quality_counts:HS.counts)[k])}</button>`).join('')}</div>`:'';
 const cat=!HL.bucket&&HL.entity!=='organizers'?`<label class="f"><span class="lbl">Категория досуга</span><select id="home-category"><option value="">Все категории</option>${hCats().map(c=>`<option${HL.cat===c?' selected':''}>${esc(c)}</option>`).join('')}<option value="__none"${HL.cat==='__none'?' selected':''}>Без категории</option></select></label>`:'';

function homeSelectionPanel(){const r=HSelection;if(!r||String(r.public_id||r.id)!==String(S.arg)||!Array.isArray(r.quality)||!r.quality.length)return '';return `<section class="panel"><h2>Причины проверки</h2>${r.quality.filter(x=>x.actionable!==false).map(x=>`<div><b>${esc(x.label||x.field)}</b> · ${esc(x.reason_label||'Причина пока не зафиксирована')}</div>`).join('')}<div class="note2">Диагностика на момент открытия списка. Пустое поле не доказывает, что робот уже искал.</div></section>`}
async function openHomeCard(entity,id,raw=false){HSelection=S.view==='homeList'?(HLdata&&HLdata.rows||[]).find(r=>String(r.public_id||r.id)===String(id))||null:null;if(raw){S.homeReturn='homeList';if(go('homeDetail',id)===false)return;loadHomeDetail(entity,id,true);return}S.homeReturn=S.view==='homeDetail'?(S.homeReturn||'home'):S.view==='homeList'?'homeList':'home';if(entity==='events'){go('evcard',id);return}if(entity==='places'){go('plcard',id);return}if(go('homeDetail',id)!==false)loadHomeDetail(entity,id,false)}
async function loadHomeDetail(entity,id,raw){const seq=++HDseq;HD=null;HDerr=null;HDbusy=true;render();try{const r=await homeDetailRead(entity,id,raw,hListParams());if(seq===HDseq)HD=r}catch(e){if(seq===HDseq)HDerr=e}finally{if(seq===HDseq){HDbusy=false;if(S.view==='homeDetail')render()}}}
function homeDetail(){const r=HD;return `<button class="back" data-go="${S.homeReturn||'homeList'}">← ${S.homeReturn==='home'?'Главная':'К списку'}</button>`+(HDbusy?'<div class="empty">Загружаю карточку…</div>':HDerr?hApiError():!r?'<div class="empty">Запись не найдена.</div>':`<section class="panel"><div class="lbl">${esc(r.entity==='raw'?(['direct','direct_event'].includes(r.kind)?'Прямая запись события':'Сырая запись источника'):HOME_TYPES[r.entity]||'Карточка')} · ${esc(r.public_id||r.id||'')}</div><h1>${esc(r.name||r.title||'Без названия')}</h1>${r.description?`<p>${esc(r.description)}</p>`:''}<div class="fields">${Object.entries(r.fields||{}).map(([k,v])=>`<div class="f"><span class="lbl">${esc(k)}</span><span>${esc(v==null?'Не определено':Array.isArray(v)?v.join(', '):v)}</span></div>`).join('')}</div>${r.source_url&&qSafeUrl(r.source_url)?`<a href="${esc(qSafeUrl(r.source_url))}" target="_blank" rel="noopener noreferrer">Первоисточник ↗</a>`:''}${r.event_id?`<button class="btn" data-hopen="events" data-hid="${esc(r.event_id)}">Открыть связанную карточку события →</button>`:''}${Array.isArray(r.events)&&r.events.length?`<h2 style="margin-top:20px">Связанные события</h2><div class="ailinks">${r.events.map(e=>`<button class="btn" data-hopen="events" data-hid="${esc(e.id)}">${esc(e.title)} · ${esc(e.id)}</button>`).join('')}</div>`:''}<h2 style="margin-top:20px">Причины проверки</h2>${(r.issues||r.quality||[]).filter(x=>x.actionable!==false).map(x=>`<div class="panel"><b>${esc(x.label||x.field)}</b><div>${esc(x.reason_label||'Причина пока не зафиксирована')}</div></div>`).join('')||'<div class="note2">Зафиксированных причин проверки нет. Это не подтверждение всех фактов.</div>'}</section>`)}
document.addEventListener('input',ev=>{if(ev.target.id!=='home-search')return;HSEARCH.q=ev.target.value;HSEARCH.seq++;HSEARCH.rows=[];HSEARCH.error='';HSEARCH.busy=false;clearTimeout(HSEARCH.timer);paintHomeSearch();HSEARCH.timer=setTimeout(runHomeSearch,250)});
document.addEventListener('change',ev=>{if(ev.target.id==='home-search-mode'){HSEARCH.mode=ev.target.value;clearTimeout(HSEARCH.timer);runHomeSearch()}if(ev.target.id==='home-category'){HL.cat=ev.target.value;HL.offset=0;loadHomeList()}});
document.addEventListener('click',ev=>{let t;
 if(ev.target.closest('[data-home-refresh]')){loadHomeSummary();loadVisibleSnapshot(true);return}
 if(ev.target.closest('[data-hall]')){openHomeList({entity:'events'});return}
 if(ev.target.closest('[data-hquality]')){openHomeList({entity:'events',quality:true});return}
 if(t=ev.target.closest('[data-hlist]')){openHomeList({entity:t.dataset.hlist});return}
 if(t=ev.target.closest('[data-hperiod]')){openHomeList({entity:'events',period:t.dataset.hperiod});return}
 if(t=ev.target.closest('[data-hbucket]')){openHomeList({bucket:t.dataset.hbucket});return}
 if(t=ev.target.closest('[data-htype]')){HL.entity=t.dataset.htype;HL.cat='';HL.offset=0;loadHomeList();return}
 if(t=ev.target.closest('[data-hrow]')){const r=(HLdata&&HLdata.rows||[]).find(x=>String(x.id)===t.dataset.hrow);openHomeCard(t.dataset.hentity,HL.bucket?t.dataset.hrow:r&&r.public_id||t.dataset.hrow,!!HL.bucket);return}
 if(t=ev.target.closest('[data-hopen]')){openHomeCard(t.dataset.hopen,t.dataset.hid);return}
 if(ev.target.closest('[data-hretry]')){loadHomeList();return}
 if(t=ev.target.closest('[data-hpage]')){HL.offset=Math.max(0,HL.offset+(t.dataset.hpage==='next'?50:-50));loadHomeList()}
});
/* End Home control centre. */

function tile(v,t,s,goV,patch,cls){return `<button class="tile ${cls||""}" data-go="${goV}" data-patch='${esc(JSON.stringify(patch||{}))}'><span class="v">${v}</span><span class="t">${t}</span>${s?`<span class="s">${s}</span>`:""}</button>`}

function evFiltered(){
  let L=S.evMode==="archive"?EV.filter(isArchived):S.evMode==="showcase"?EV.filter(e=>e.showcase):S.evMode==="all"?EV.slice():S.evMode==="base"?EV.filter(inBase):S.evMode==="wait"?EV.filter(waiting):S.evMode==="notev"?EV.filter(notEvent):active();
  const f=S.evF;
  if(f.cat)L=L.filter(e=>e.category===f.cat);
  if(f.mood)L=L.filter(e=>(e.moods||[]).includes(f.mood));
  if(f.fw)L=L.filter(e=>(e.for_whom||[]).includes(f.fw));
  if(f.band)L=L.filter(e=>priceBand(e.price)===f.band);
  if(f.stage)L=L.filter(e=>e.stage===f.stage);
  if(f.issue)L=L.filter(e=>issues(e).includes(f.issue));
  if(f.place)L=L.filter(e=>e.place_id===f.place);
  if(S.q){const q=S.q.toLowerCase();L=L.filter(e=>(e.title+" "+e.title_src+" "+(e.place_name||"")+" "+(e.performer||"")).toLowerCase().includes(q))}
  L.sort((a,b)=>S.evMode==="archive"?(b.start||"").localeCompare(a.start||""):(a.start||"").localeCompare(b.start||""));
  return L;
}
function groupOf(iso){if(!iso)return"Без даты";const d=new Date(iso),now=new Date();const k=dayKey(d),t=dayKey(now),tm=dayKey(new Date(now.getTime()+864e5));if(k<t)return"Прошедшие";if(k===t)return"Сегодня";if(k===tm)return"Завтра";const dow=(Number(new Intl.DateTimeFormat("en-US",{timeZone:TZ,weekday:"short"}).format(now)==="Sun"?7:["Mon","Tue","Wed","Thu","Fri","Sat","Sun"].indexOf(new Intl.DateTimeFormat("en-US",{timeZone:TZ,weekday:"short"}).format(now))+1));const endW=dayKey(new Date(now.getTime()+(7-dow)*864e5));if(k<=endW)return"На этой неделе";return"Позже"}
function breakdown(title,items,key,cur){const max=Math.max(1,...items.map(i=>i[1]));return `<div class="panel" style="display:flex;flex-direction:column;gap:10px"><div class="lbl">${title}</div><div class="bars">${items.map(([k,n,label])=>`<button class="bar${cur===k?" on":""}" data-f="${key}" data-v="${esc(k)}"><span class="bt">${esc(label||k)}</span><span class="track"><span class="fill" style="width:${n/max*100}%"></span></span><span class="bn">${n}</span></button>`).join("")}</div></div>`}
function stPill(s){return `<span class="st s${s}">${STAGES[s]||"—"}</span>`}
function moodTags(e){return (e.moods||[]).map(m=>`<span class="tg m">${esc(MOOD[m]?MOOD[m][2]:m)}${m===e.mood_main&&e.moods.length>1?" ★":""}</span>`).join("")||`<span class="bad">нет</span>`}
function events(){
  const a=active(),f=S.evF;
  const tl=(v,t,patch,cls,sel)=>`<button class="tile ${cls||""}${sel?" sel":""}" data-ev='${esc(JSON.stringify(patch))}'><span class="v">${v}</span><span class="t">${t}</span></button>`;
  const cnt=(arr,fn)=>arr.map(k=>[k,a.filter(e=>fn(e,k)).length]);
  const L=evFiltered();
  let rows="",g="";
  for(const e of L){const gg=S.evMode==="archive"?"Архив":groupOf(e.start);if(gg!==g){g=gg;rows+=`<tr class="grp"><td colspan="9">${g}</td></tr>`}
    rows+=`<tr class="click" data-go="event" data-arg="${e.id}"><td><div class="id">${e.id}</div></td><td><div style="display:flex;gap:10px;align-items:center">${e.image?`<img class="thumb" src="${esc(e.image)}" alt="" loading="lazy" onerror="this.remove()">`:""}<div><div class="tt">${esc(e.title)}</div><div class="id">${esc(e.place_name||e.meeting_point||"")}</div></div></div></td><td>${esc(e.type)}${e.genre?` · <span class="muted">${esc(e.genre)}</span>`:""}</td><td><a href="#" data-go="category" data-arg="${esc(e.category)}" class="catlink">${esc(e.category)}</a></td><td style="white-space:nowrap">${fmtD(e.start)}<div class="id">${fmtT(e.start)}</div></td><td>${e.place_name?esc(e.place_name):e.meeting_point?`<span class="muted">Сбор: ${esc(e.meeting_point)}</span>`:`<span class="bad">нет места</span>`}</td><td>${moodTags(e)}</td><td style="white-space:nowrap">${priceTxt(e.price)}</td><td>${stPill(e.stage)}</td></tr>`}
  const fl=Object.entries(f).filter(([k,v])=>v).map(([k,v])=>`<button class="chip on" data-clear="${k}">${k==="issue"?ISSUES[v]:k==="stage"?STAGES[v]:k==="mood"?MOOD[v][2]:k==="place"?(placeById(v)||{}).name:v} ✕</button>`).join("");
  return `<div class="head"><div><div class="lbl">Реестр</div><h1>События</h1><div class="sub">«Собрано» — все предстоящие события. «В базе» — прошли проверку AI или человека. «На проверке» — только то, что Робот Афиша не смог решить сам; проверяет человек. «Не события» — аттракционы, прокат, входные билеты, постоянные экспозиции: материал для карточек мест, на витрину не идут.</div></div></div>
  <div class="tiles">${tl(a.length,"Собрано",{evMode:"active",evF:{}},"",S.evMode==="active")}${tl(EV.filter(inBase).length,"В базе",{evMode:"base",evF:{}},"",S.evMode==="base")}${tl(EV.filter(waiting).length,"На проверке",{evMode:"wait",evF:{}},"warn",S.evMode==="wait")}${tl(EV.filter(e=>e.showcase).length,"На витрине",{evMode:"showcase",evF:{}},"",S.evMode==="showcase")}${tl(EV.filter(isArchived).length,"Архив",{evMode:"archive",evF:{}},"",S.evMode==="archive")}</div>
  <section class="grid2">
   ${breakdown("По категориям · действующие",cnt(CATS,(e,k)=>e.category===k).filter(x=>x[1]),"cat",f.cat)}
   ${breakdown("По настроениям",MOODS.map(m=>[m[0],a.filter(e=>(e.moods||[]).includes(m[0])).length,m[2]]),"mood",f.mood)}
   ${breakdown("Для кого",cnt(FW.map(x=>x[0]),(e,k)=>(e.for_whom||[]).includes(k)),"fw",f.fw)}
   ${breakdown("По цене",cnt(BANDS,(e,k)=>priceBand(e.price)===k),"band",f.band)}
  </section>
  <div class="row" style="justify-content:space-between"><div class="seg">${[["base","В базе"],["wait","На проверке"],["notev","Не события"],["active","Все предстоящие"],["showcase","На витрине"],["archive","Архив"]].map(([k,t])=>`<button class="${S.evMode===k?"on":""}" data-ev='${JSON.stringify({evMode:k})}'>${t}</button>`).join("")}</div><input class="search" id="q" type="search" placeholder="Поиск: название, место, артист" value="${esc(S.q)}"></div>
  ${fl?`<div class="row">${fl}</div>`:""}
  <div class="tablewrap"><table><thead><tr><th>ID</th><th>Название</th><th>Тип и жанр</th><th>Категория</th><th>Дата</th><th>Место</th><th>Настроения</th><th>Цена</th><th>Стадия</th></tr></thead><tbody>${rows||`<tr><td colspan="9"><div class="empty">Под эти условия событий нет.</div></td></tr>`}</tbody></table></div>`;
}

function nextEvent(pid){return active().filter(e=>e.place_id===pid).sort((a,b)=>a.start.localeCompare(b.start))[0]}
function places(){
  let L=PL.slice();const f=S.plF;
  if(f.cat)L=L.filter(p=>p.category===f.cat);if(f.type)L=L.filter(p=>p.type===f.type);if(f.noaddr)L=L.filter(p=>!p.address);
  L.sort((a,b)=>{const x=nextEvent(a.id),y=nextEvent(b.id);if(x&&y)return x.start.localeCompare(y.start);if(x)return-1;if(y)return 1;return a.name.localeCompare(b.name,"ru")});
  const cnt=(key)=>{const m={};PL.forEach(p=>m[p[key]]=(m[p[key]]||0)+1);return Object.entries(m).sort((a,b)=>b[1]-a[1])};
  const rows=L.map(p=>{const n=nextEvent(p.id);const k=active().filter(e=>e.place_id===p.id).length;return `<tr class="click" data-go="place" data-arg="${p.id}"><td><div class="id">${p.id}</div></td><td><div class="tt">${esc(p.name)}</div>${p.instagram?`<div class="id">@${esc(p.instagram)}</div>`:""}</td><td>${esc(p.category)}</td><td>${esc(p.type)}</td><td>${p.address?esc(p.address):`<span class="bad">нет адреса</span>`}</td><td>${n?`<div class="tt" style="font-weight:500">${esc(n.title)}</div><div class="id">${fmtDT(n.start)}${k>1?` · ещё ${k-1}`:""}</div>`:`<span class="muted">—</span>`}</td><td>${stPill(p.stage)}</td></tr>`}).join("");
  const fl=Object.entries(f).filter(([k,v])=>v).map(([k,v])=>`<button class="chip on" data-pclear="${k}">${k==="noaddr"?"Без адреса":v} ✕</button>`).join("");
  return `<div class="head"><div><div class="lbl">Реестр</div><h1>Места</h1><div class="sub">Сначала места с ближайшими событиями, дальше по алфавиту. Название официальное, Instagram отдельно.</div></div></div>
  <div class="tiles">${[[PL.length,"Всего",{}],[PL.filter(p=>p.status!=="закрыто").length,"Активные",{}],[PL.filter(p=>p.showcase).length,"На витрине",{}],[PL.filter(p=>!p.address).length,"Без адреса",{noaddr:1}],[PL.filter(p=>p.status==="закрыто"||p.status==="переехало").length,"Архив",{}]].map(([v,t,pf])=>`<button class="tile" data-pl='${JSON.stringify(pf)}'><span class="v">${v}</span><span class="t">${t}</span></button>`).join("")}</div>
  <section class="grid2">${breakdown("По категориям",cnt("category"),"pcat",f.cat)}${breakdown("По типам мест",cnt("type"),"ptype",f.type)}</section>
  ${fl?`<div class="row">${fl}</div>`:""}
  <div class="tablewrap"><table><thead><tr><th>ID</th><th>Место</th><th>Категория</th><th>Тип</th><th>Адрес</th><th>Ближайшее событие</th><th>Стадия</th></tr></thead><tbody>${rows}</tbody></table></div>`;

function category(c){
  const pl=PL.filter(p=>p.category===c);const evs=active().filter(e=>e.category===c).sort((a,b)=>a.start.localeCompare(b.start));
  const now=Date.now(),wk=now+7*864e5,mo=now+31*864e5,today=dayKey(new Date());
  const inTab=e=>{const t=new Date(e.start).getTime();return S.catTab==="today"?dayKey(new Date(e.start))===today:S.catTab==="week"?t<=wk:t<=mo};
  const list=evs.filter(inTab);
  const wkN=evs.filter(e=>new Date(e.start).getTime()<=wk).length;
  return `<button class="back" data-go="home">← Главная</button><div class="head"><div><div class="lbl">Категория досуга</div><h1>${esc(c)}</h1><div class="sub">Направления: ${(DIRS[c]||[]).join(" · ")}</div></div></div>

function mdToHtml(md){const lines=String(md||"").split(/\n/);let h="",list=null,tbl=null;const inl=t=>esc(t).replace(/\*\*(.+?)\*\*/g,"<b>$1</b>").replace(/\*(.+?)\*/g,"<i>$1</i>").replace(/(https?:\/\/[^\s)]+)/g,'<a href="$1" target="_blank" rel="noopener">$1</a>');
 const close=()=>{if(list){h+=`</${list}>`;list=null}if(tbl){h+="</tbody></table></div>";tbl=null}};
 for(const raw of lines){const l=raw.trimEnd();
  if(/^\s*\|/.test(l)){if(/^\s*\|[\s:|-]+\|\s*$/.test(l))continue;const cells=l.trim().replace(/^\||\|$/g,"").split("|").map(x=>x.trim());if(!tbl){close();h+=`<div class="tablewrap"><table><thead><tr>${cells.map(c=>`<th>${inl(c)}</th>`).join("")}</tr></thead><tbody>`;tbl=1}else h+=`<tr>${cells.map(c=>`<td>${inl(c)}</td>`).join("")}</tr>`;continue}
  let m;if(m=l.match(/^(#{1,4})\s+(.*)/)){close();const n=Math.min(3,m[1].length);h+=`<h${n}>${inl(m[2])}</h${n}>`;continue}
  if(/^\s*(-{3,}|\*{3,})\s*$/.test(l)){close();h+="<hr>";continue}
  if(m=l.match(/^\s*[-*•+]\s+(.*)/)){if(list!=="ul"){close();h+="<ul>";list="ul"}h+=`<li>${inl(m[1])}</li>`;continue}
  if(m=l.match(/^\s*\d+[.)]\s+(.*)/)){if(list!=="ol"){close();h+="<ol>";list="ol"}h+=`<li>${inl(m[1])}</li>`;continue}
  if(!l.trim()){close();continue}
  close();h+=`<p>${inl(l)}</p>`}
 close();return h}

function parseSource(line,forcedType){

  const ig=igPost?null:(raw.match(/^@([A-Za-z0-9._]{2,})$/)||raw.match(/instagram\.com\/([A-Za-z0-9._]+)/i));

  if(igPost){name="пост Instagram";url="https://www.instagram.com/"+igPost[1]+"/"+igPost[2]+"/";type="Соцсети"}
  else if(ig){name="@"+ig[1];url="https://instagram.com/"+ig[1];type="Соцсети"}
  else if(tg){name="@"+tg[1];url="https://t.me/"+tg[1];type="Telegram-каналы"}
  else{if(!/^https?:\/\//i.test(url))url="https://"+url;let host="";try{host=new URL(url).hostname.replace(/^www\./,"")}catch(e){return {bad:true,url:raw,name:raw,type:"—"}}name=host;
    if(/facebook|tiktok|vk\.com|youtube|threads/.test(host))type="Соцсети";else if(TICKET_DOMAINS.some(d=>host.includes(d)))type="Билетные платформы";else if(/sxodim|inalmaty|afisha|kudago|gorodzovet/.test(host))type="Агрегаторы и медиа";else if(/2gis|maps\.google|google\.[a-z.]+\/maps|yandex\.[a-z]+\/maps|restoran\.kz/.test(url))type="Карты и каталоги";else if(/gov\.kz|akimat/.test(host))type="Официальные источники";else type="Сайты площадок"}
  if(forcedType)type=forcedType;
  const norm=url.toLowerCase().replace(/^https?:\/\/(www\.)?/,"").replace(/\/+$/,"");
  const dup=SR.some(s=>s.url&&s.url.toLowerCase().replace(/^https?:\/\/(www\.)?/,"").replace(/\/+$/,"")===norm);

  return {url,name,type,trust,dup};
}

  if(/\/(event|events|concert|concerts|show|spektakl|e)\/[^/?#]+/.test(x))return "event";

  return "place"}

  ${plFillPanel(c,miss)}
  <div class="card"${PCsave?" inert":""}><div style="display:flex;flex-direction:column;gap:16px;min-width:0">
   <div class="fields">
    ${inF("name","Название","text","",true)}
    ${selF("cat","Категория досуга",R.cats)}
    ${fld("Тип места",typeSel)}
    ${inF("specialization","Чем занимается","text","например: джаз-клуб, банный комплекс",true)}
    ${selF("district","Район",R.districts,"не указан")}
    ${inF("check","Средний чек, ₸","number","")}
    ${inF("address","Адрес","text","",true)}
    ${inF("phone","Телефон","tel","+7 …")}
    ${inF("website_url","Сайт","url","https://…")}
    ${inF("social_url","Instagram или другая соцсеть","url","https://instagram.com/…",true)}
    ${fld("Для кого · с кем идти",`<div>${fwChips}</div>`,true)}
    ${fld("На витрине",`<label class="ck"><input type="checkbox" data-pd="showcase"${d.showcase?" checked":""}> показывать на витрине</label>`)}
    ${fld("Часы работы",c.hours?esc(hoursText(c.hours)):`<span class="muted">не указаны</span>`)}
    ${(c.attrs||[]).length?fld("Особенности",`<div>${c.attrs.map(a=>`<span class="tg">${esc(a)}</span>`).join(" ")}</div>`,true):""}
   </div>
   <div class="row" style="justify-content:space-between"><span class="row">${actions}<button class="btn${st==="candidate"?"":" pri"}" data-pcsave="1"${PCsave?" disabled":""}>${PCsave?"Сохраняю…":"Сохранить"}</button></span>${archBlock}</div>
  </div>
  <div class="side-sec">
   ${(c.changes||[]).length?`<div class="panel vpanel" style="border-color:var(--warn)"><div class="lbl">Робот актуализации заметил</div>${c.changes.map(x=>`<div style="font-size:14px"><span class="st s3">${PCHG_L[x.kind]||x.kind}</span> ${x.kind==="phone_changed"?`${esc((x.detail||{}).from||"—")} → <b>${esc((x.detail||{}).to||"")}</b>`:x.detail&&x.detail.url?`<a href="${esc(x.detail.url)}" target="_blank" rel="noopener">карточка в 2ГИС ↗</a>`:""} <span class="note2">· ${fmtD(x.at)}</span></div>`).join("")}<div class="row"><button class="btn" data-pcchg="1">Проверено, всё учтено</button></div><div class="note2">Если место закрылось — отправьте в архив. Если сменился телефон — поправьте поле и отметьте проверенным.</div></div>`:""}
   ${plMarkPanel(c)}
   ${plIgPanel(c)}
   <div class="panel vpanel"><div class="lbl">Ссылки</div><div class="checks">${map?`<a href="${esc(map)}" target="_blank" rel="noopener">На карте 2ГИС ↗</a>`:""}${safe(d.website_url)?`<a href="${esc(d.website_url)}" target="_blank" rel="noopener">Сайт ↗</a>`:""}${safe(d.social_url)?`<a href="${esc(d.social_url)}" target="_blank" rel="noopener">${ig?"@"+esc(ig):"Соцсеть"} ↗</a>`:""}${srcUrl?`<a href="${esc(srcUrl)}" target="_blank" rel="noopener">Источник ↗</a>`:""}</div><div class="note2">Заведено ${fmtD(c.created)} · откуда: ${esc(srcName)}${c.verified?` · проверено ${fmtD(c.verified)}`:""}${c.human?` · правил человек ${fmtD(c.human)}`:""}</div></div>
   <div class="panel vpanel"><div class="vhead"><div class="lbl">События здесь</div><span class="note2">${nf(c.evn||0)} действующих</span></div>${evs||`<span class="muted">Предстоящих событий нет.</span>`}</div>
   ${(c.similar||[]).length?`<div class="panel vpanel"><div class="lbl">Похожие места — возможно, дубли</div>${c.similar.map(x=>`<a href="#" data-go="plcard" data-arg="${esc(x.id)}"><b>${esc(x.name)}</b><div class="id">${esc([x.id,x.addr,PST_V[x.status]||x.status].filter(Boolean).join(" · "))}</div></a>`).join("")}</div>`:""}
   <div class="panel vpanel"><div class="lbl">История изменений</div><div class="hist">${hist||`<span class="muted">Правок пока не было.</span>`}</div></div>
  </div></div>`;
}
document.addEventListener("input",ev=>{const t=ev.target;if(PCsave||!PD||S.view!=="plcard"||!t.dataset||!t.dataset.pd||t.tagName==="SELECT"||t.type==="checkbox")return;PD[t.dataset.pd]=t.value;PCmsg=""});
document.addEventListener("change",ev=>{const t=ev.target;if(PCsave||!PD||S.view!=="plcard"||!t.dataset||!t.dataset.pd)return;if(t.type==="checkbox"){PD[t.dataset.pd]=t.checked;return}if(t.tagName==="SELECT"){PD[t.dataset.pd]=t.value;PCmsg=""}});
document.addEventListener("click",ev=>{
  if(PCsave||!PD||S.view!=="plcard")return;let t;
  if(t=ev.target.closest("[data-pdchip]")){ev.preventDefault();const a=PD[t.dataset.pdchip],v=t.dataset.v,i=a.indexOf(v);if(i>=0)a.splice(i,1);else a.push(v);PCmsg="";render();return}
  if(ev.target.closest("[data-pcsave]")){ev.preventDefault();plSave();return}
  {const t=ev.target.closest("[data-pigm]");if(t){ev.preventDefault();plSetIg(t.dataset.pigm);return}}
  if(ev.target.closest("[data-pcconfirm]")){ev.preventDefault();plSave("confirm");return}
  if(ev.target.closest("[data-pcrestore]")){ev.preventDefault();plSave("restore");return}
  if(ev.target.closest("[data-pcarch]")){ev.preventDefault();PCarch=true;render();return}
  if(ev.target.closest("[data-pcarchno]")){ev.preventDefault();PCarch=false;render();return}
  if(ev.target.closest("[data-pcarchyes]")){ev.preventDefault();plSave("archive");return}
});
{const goP=go;go=function(v,a,p){if(goP(v,a,p)===false)return false;if(v==="places"&&S.plScroll){const y=S.plScroll;S.plScroll=0;requestAnimationFrame(()=>window.scrollTo(0,y))}}}

window.addEventListener("beforeunload",ev=>{if((S.view==="evcard"&&(ECsave||evDirty()))||(S.view==="plcard"&&(PCsave||(PD&&PC&&JSON.stringify(PD)!==JSON.stringify(pdraftOf(PC)))))){ev.preventDefault();ev.returnValue=""}});
APP_CAN_LEAVE=()=>{if(ECsave||PCsave)return false;return !(evDirty()||(PD&&PC&&JSON.stringify(PD)!==JSON.stringify(pdraftOf(PC))))||window.confirm("Есть несохранённые правки. Уйти без сохранения?")};
render();loadStats();loadHomeSummary();
apiCall("legacy_data",{}).then(r=>{EV=r.events||[];PL=r.places||[];render()}).catch(()=>toast("Не удалось загрузить сводные счётчики. Рабочие реестры доступны отдельно."));

}
</script>

</body></html>
