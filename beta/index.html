<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Бета — дашборд</title>
<style>
:root{--bg:#121212;--card:#1e1c20;--card2:#2a2730;--ink:#f4f1f3;--ink2:#a9a3ab;--line:#34303a;--accent:#e91e8c;--accent2:#8b5cf6;--ok:#3ecf8e;--warn:#ffb020;--bad:#ff5a5f}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit}
.wrap{max-width:1100px;margin:0 auto;padding:calc(10px + env(safe-area-inset-top,0)) 16px calc(40px + env(safe-area-inset-bottom,0))}
.mk{background:linear-gradient(90deg,var(--accent),var(--accent2));color:#fff;font-size:12px;font-weight:700;border-radius:10px;padding:6px 10px;margin-bottom:12px;text-align:center}
header{display:flex;align-items:center;gap:10px;margin-bottom:4px}
header a{color:var(--accent);text-decoration:none;font-size:14px}
header h1{font-size:20px;margin:0;flex:1}
.lead{color:var(--ink2);font-size:13px;margin:0 0 12px}
.chips{display:flex;gap:6px;overflow-x:auto;margin-bottom:8px;padding-bottom:2px}
.chips::-webkit-scrollbar{display:none}
.chips button{flex-shrink:0;border:1px solid var(--line);background:none;border-radius:18px;padding:7px 13px;font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap}
.chips button.on{background:var(--accent);border-color:var(--accent);color:#fff}
.chips button small{opacity:.7;font-weight:500;margin-left:4px}
.card{background:var(--card);border-radius:18px;padding:14px;margin-bottom:12px}
.card h2{font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink2);margin:0 0 10px;font-weight:700}
.light{display:flex;gap:14px;align-items:center}
.dot{width:54px;height:54px;border-radius:27px;flex-shrink:0;box-shadow:0 0 24px currentColor;background:currentColor}
.light b{font-size:19px;display:block}
.light p{margin:3px 0 0;color:var(--ink2);font-size:13px}
.g{color:var(--ok)}.y{color:var(--warn)}.r{color:var(--bad)}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:14px}
.kpi{background:var(--card2);border-radius:12px;padding:10px}
.kpi span{font-size:11px;color:var(--ink2);display:block}
.kpi b{font-size:22px}
@media(max-width:640px){.kpis{grid-template-columns:repeat(2,1fr)}}
table{width:100%;border-collapse:collapse;font-size:14px}
th{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink2);text-align:right;font-weight:600;padding:6px 6px}
th:first-child{text-align:left}
td{padding:10px 6px;border-top:1px solid var(--line);text-align:right;white-space:nowrap}
td:first-child{text-align:left;white-space:normal}
td small{display:block;color:var(--ink2);font-size:11.5px}
.dev{font-weight:700;border-radius:8px;padding:2px 7px}
.dev.g{background:rgba(62,207,142,.14)}.dev.y{background:rgba(255,176,32,.14)}.dev.r{background:rgba(255,90,95,.14)}
.dev.n{color:var(--ink2)}
.main-m td:first-child::after{content:'главная';margin-left:6px;font-size:10px;background:var(--accent);color:#fff;border-radius:6px;padding:1px 5px;vertical-align:2px}
.funnel .row{display:flex;align-items:center;gap:10px;margin:7px 0;font-size:13px}
.funnel .lbl{width:150px;flex-shrink:0;color:var(--ink2);overflow-wrap:anywhere;line-height:1.2}
.funnel .bar{flex:1;background:var(--card2);border-radius:8px;height:26px;position:relative;overflow:hidden}
.funnel .bar i{position:absolute;inset:0 auto 0 0;background:linear-gradient(90deg,var(--accent),var(--accent2));border-radius:8px}
.funnel .bar span{position:absolute;left:10px;top:4px;font-weight:700;font-size:13px}
.funnel .pc{width:58px;text-align:right;color:var(--ink2);flex-shrink:0}
@media(max-width:640px){.funnel .lbl{width:96px;font-size:11.5px}.cmp th{white-space:normal;font-size:10px}.cmp td{padding:9px 4px}}
.days{display:flex;align-items:flex-end;gap:4px;height:120px;margin-top:6px}
.days .d{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;height:100%;justify-content:flex-end}
.days .d i{width:100%;max-width:26px;border-radius:5px 5px 2px 2px;background:var(--accent2)}
.days .d i.ret{background:var(--ok)}
.days .d small{font-size:10px;color:var(--ink2)}
.legend{display:flex;gap:14px;font-size:12px;color:var(--ink2);margin-top:8px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.cmp td{font-size:13px}
.note{font-size:12px;color:var(--ink2);margin-top:8px}
</style>
</head>
<body>
<div class="wrap">
  <div class="mk">Макет · цифры примерные · бета стартует 10 ноября</div>
  <header><a href="../">← База</a><h1>Бета Афиши</h1></header>
  <p class="lead" id="lead"></p>

  <div class="chips" id="period"></div>
  <div class="chips" id="groups"></div>

  <div class="card">
    <div class="light" id="light"></div>
    <div class="kpis" id="kpis"></div>
  </div>

  <div class="card">
    <h2>Метрики · план и факт</h2>
    <table id="tbl"></table>
    <div class="note">Отклонение — разница факта с планом. Зелёный — план выполнен, жёлтый — не дотягиваем меньше 5 пунктов, красный — больше.</div>
  </div>

  <div class="card funnel">
    <h2>Воронка</h2>
    <div id="funnel"></div>
  </div>

  <div class="card">
    <h2>По дням</h2>
    <div class="days" id="days"></div>
    <div class="legend"><span><i style="background:var(--accent2)"></i>Новые регистрации</span><span><i style="background:var(--ok)"></i>Вернулись</span></div>
  </div>

  <div class="card">
    <h2>Сравнение групп</h2>
    <div style="overflow-x:auto;margin:0 -6px"><table class="cmp" id="cmp"></table></div>
  </div>
</div>

<script>
// Примерные цифры для макета: потом — из базы Афиши
const GROUPS = {
  turan:   { name:'Колледж «Туран»', click:520, reg:182, useful:70,  ret:38, codeSent:205, codeOk:196, bugs:3, found:58, nps:7.6, answered:64 },
  atu:     { name:'АТУ',             click:640, reg:205, useful:92,  ret:57, codeSent:228, codeOk:219, bugs:4, found:61, nps:7.9, answered:71 },
  tke:     { name:'Теплокоммунэнерго',click:410, reg:98,  useful:31,  ret:19, codeSent:120, codeOk:109, bugs:2, found:44, nps:6.8, answered:40 },
  friends: { name:'Знакомые',        click:150, reg:72,  useful:41,  ret:29, codeSent:76,  codeOk:75,  bugs:1, found:66, nps:8.4, answered:35 },
};
const DAYS = ['10.11','11.11','12.11','13.11','14.11','15.11','16.11','17.11','18.11','19.11','20.11','21.11','22.11','23.11'];
const DAY_SHARE = [.22,.16,.11,.09,.07,.06,.06,.05,.04,.04,.03,.03,.02,.02];
const RET_SHARE = [0,.04,.07,.08,.09,.1,.11,.09,.08,.08,.07,.07,.06,.06];
let group = 'all', period = 'all';

function sum(g){
  if(g!=='all') return GROUPS[g];
  const out = { name:'Все группы' }; const ks = Object.values(GROUPS);
  ['click','reg','useful','ret','codeSent','codeOk','bugs','answered'].forEach(k=> out[k] = ks.reduce((s,x)=>s+x[k],0));
  out.found = Math.round(ks.reduce((s,x)=>s+x.found*x.answered,0)/out.answered);
  out.nps = Math.round(ks.reduce((s,x)=>s+x.nps*x.answered,0)/out.answered*10)/10;
  return out;
}
function today(g){ // «сегодня» в макете = последний день
  const x = sum(g); const k = DAY_SHARE[DAY_SHARE.length-1];
  return { ...x, click:Math.round(x.click*k*1.4), reg:Math.round(x.reg*k), useful:Math.round(x.useful*k*1.2), ret:Math.round(x.ret*RET_SHARE.at(-1)), codeSent:Math.round(x.codeSent*k), codeOk:Math.round(x.codeOk*k), bugs:0 };
}
const pct = (a,b)=> b ? Math.round(a/b*100) : 0;
function metrics(x){
  return [
    { name:'Зарегистрировались', sub:'из перешедших по ссылке', plan:30, fact:pct(x.reg,x.click), unit:'%', abs:`${x.reg} из ${x.click}` },
    { name:'Вернулись за неделю', sub:'из зарегистрированных', plan:25, fact:pct(x.ret,x.reg), unit:'%', abs:`${x.ret} из ${x.reg}`, main:true },
    { name:'Полезное действие', sub:'избранное, билет, маршрут', plan:40, fact:pct(x.useful,x.reg), unit:'%', abs:`${x.useful} из ${x.reg}` },
    { name:'Код входа сработал', sub:'из отправленных кодов', plan:95, fact:pct(x.codeOk,x.codeSent), unit:'%', abs:`${x.codeOk} из ${x.codeSent}` },
    { name:'Жалобы на карточки', sub:'за первую неделю, меньше — лучше', plan:10, fact:x.bugs, unit:'', abs:'', lower:true },
    { name:'«Нашли, куда сходить?» — да', sub:`опрос, ответили ${x.answered}`, plan:50, fact:x.found, unit:'%', abs:'' },
    { name:'«Посоветуете другу?»', sub:'средний балл из 10', plan:7, fact:x.nps, unit:'', abs:'', score:true },
  ];
}
function devOf(m){
  const d = m.lower ? m.plan - m.fact : Math.round((m.fact - m.plan)*10)/10;
  const cls = d>=0 ? 'g' : (m.score ? (d>=-0.5?'y':'r') : (d>=-5?'y':'r'));
  return { d, cls };
}
const fmtD = (d,m)=> (d>0?'+':d<0?'−':'') + Math.abs(d) + (m.unit==='%'?' п.п.':'');

function light(x){
  const m = metrics(x); const by = n=> m.find(z=>z.name===n);
  const reg = by('Зарегистрировались'), code = by('Код входа сработал'), ret = by('Вернулись за неделю'), use = by('Полезное действие');
  if(reg.fact<reg.plan || code.fact<code.plan) return { c:'r', t:'Красный — чиним вход', p: reg.fact<reg.plan ? `Регистрируются ${reg.fact}% при плане ${reg.plan}%: люди теряются на входе.` : `Код срабатывает у ${code.fact}% при плане ${code.plan}%.` };
  if(ret.fact<ret.plan || use.fact<use.plan) return { c:'y', t:'Жёлтый — дорабатываем витрину', p:`Регистрируются хорошо, но возвращаются ${ret.fact}% при плане ${ret.plan}%.` };
  return { c:'g', t:'Зелёный — можно расширять', p:'Все главные цифры в плане: расширяем бету и готовим переезд на @afishakz.' };
}

function render(){
  const x = period==='today' ? today(group) : sum(group);
  const all = sum(group);
  document.getElementById('lead').textContent = `День ${DAYS.length} из 14–21 · ${period==='today'?'сегодня, '+DAYS.at(-1):'с 10 ноября'} · ${x.name}`;
  document.getElementById('period').innerHTML = [['all','С начала беты'],['today','Сегодня']].map(([k,l])=>`<button data-p="${k}" class="${period===k?'on':''}">${l}</button>`).join('');
  document.getElementById('groups').innerHTML = [['all','Все',sum('all').reg], ...Object.entries(GROUPS).map(([k,v])=>[k,v.name,v.reg])]
    .map(([k,l,n])=>`<button data-g="${k}" class="${group===k?'on':''}">${l}<small>${n}</small></button>`).join('');
  const L = light(all);
  document.getElementById('light').innerHTML = `<div class="dot ${L.c}"></div><div><b class="${L.c}">${L.t}</b><p>${L.p}</p></div>`;
  document.getElementById('kpis').innerHTML = [['Перешли по ссылке',x.click],['Зарегистрировались',x.reg],['Полезное действие',x.useful],['Вернулись',x.ret]]
    .map(([l,v])=>`<div class="kpi"><span>${l}</span><b>${v}</b></div>`).join('');
  const ms = metrics(x);
  document.getElementById('tbl').innerHTML = `<tr><th>Метрика</th><th>План</th><th>Факт</th><th>Откл.</th></tr>` + ms.map(m=>{
    const skip = period==='today' && (m.name.startsWith('«') || m.name.startsWith('Жалобы') || m.name.startsWith('Вернулись'));
    const {d,cls} = devOf(m);
    return `<tr class="${m.main?'main-m':''}"><td>${m.name}<small>${m.sub}${m.abs?' · '+m.abs:''}</small></td>
      <td>${m.lower?'≤ ':'≥ '}${m.plan}${m.unit}</td><td><b>${skip?'—':m.fact+m.unit}</b></td>
      <td>${skip?'<span class="dev n">за весь период</span>':`<span class="dev ${cls} ${cls}">${fmtD(d,m)}</span>`}</td></tr>`;
  }).join('');
  const steps = [['Перешли по ссылке',x.click],['Зарегистрировались',x.reg],['Полезное действие',x.useful],['Вернулись',x.ret]];
  document.getElementById('funnel').innerHTML = steps.map(([l,v],i)=>`<div class="row"><div class="lbl">${l}</div>
    <div class="bar"><i style="width:${Math.max(3,pct(v,steps[0][1]))}%"></i><span>${v}</span></div>
    <div class="pc">${i===1 ? pct(v,steps[0][1])+'%' : i>1 ? pct(v,steps[1][1])+'%' : ''}</div></div>`).join('') +
    `<div class="note">Проценты: регистрация — от перешедших, остальное — от зарегистрированных.</div>`;
  const regs = DAY_SHARE.map(s=>Math.round(all.reg*s)), rets = RET_SHARE.map(s=>Math.round(all.ret*s));
  const mx = Math.max(...regs, ...rets, 1);
  document.getElementById('days').innerHTML = DAYS.map((d,i)=>`<div class="d" title="${d}: регистраций ${regs[i]}, вернулись ${rets[i]}">
    <div style="display:flex;gap:2px;align-items:flex-end;height:100%;width:100%;justify-content:center">
      <i style="height:${regs[i]/mx*100}%"></i><i class="ret" style="height:${rets[i]/mx*100}%"></i></div><small>${d.slice(0,2)}</small></div>`).join('');
  const rows = Object.entries(GROUPS).map(([k,v])=>{ const m = metrics(v); return [v.name, ...m.slice(0,3).map(z=>({z,...devOf(z)})), {z:m[6],...devOf(m[6])}]; });
  document.getElementById('cmp').innerHTML = `<tr><th>Группа</th><th>Регистрация</th><th>Вернулись</th><th>Полезное</th><th>Совет другу</th></tr>` +
    rows.map(([n,...c])=>`<tr><td>${n}</td>${c.map(o=>`<td><span class="dev ${o.cls} ${o.cls}">${o.z.fact}${o.z.unit}</span></td>`).join('')}</tr>`).join('');
}
document.addEventListener('click', e=>{
  const g = e.target.closest('[data-g]'); if(g){ group = g.dataset.g; render(); }
  const p = e.target.closest('[data-p]'); if(p){ period = p.dataset.p; render(); }
});
render();
</script>
</body>
</html>
