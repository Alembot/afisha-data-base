<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Afisha Data Base</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&family=Unbounded:wght@500;600&display=swap">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<style>
:root{color-scheme:light;box-sizing:border-box}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
[hidden]{display:none!important}
:root{
  --bg:#F6F4F0; --surface:#FFFFFF; --surface2:#F1EEE9; --line:#E4E0DA; --line2:#EFEBE5;
  --ink:#1A1A1F; --ink2:#5E5B57; --ink3:#8F8B84;
  --accent:#B8326B; --accent-ink:#8E2352; --accent-soft:#F8E6EE;
  --nav:#1A1A1F; --nav-ink:#D9D6D0; --nav-active:#34343C; --nav-muted:#8F8B84;
  --ok:#1F5C38; --ok-bg:#E8F3EC; --info:#1E4A8C; --info-bg:#EEF2FB; --warn:#7A4E00; --warn-bg:#FDF1E3; --bad:#9A2E1F; --bad-bg:#FBE9E7;
  --bar:#E3A9C3;
}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 Onest,system-ui,-apple-system,"Segoe UI",sans-serif;font-variant-numeric:tabular-nums}
a{color:var(--accent);text-decoration:none}
button{font:inherit;color:inherit}
h1,h2,h3{margin:0;text-wrap:balance}
h1{font-family:Unbounded,Onest,sans-serif;font-weight:600;font-size:clamp(22px,3vw,30px);letter-spacing:-.01em}
h2{font-size:19px;font-weight:700}
.lbl{font-size:11.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--ink2)}
.muted{color:var(--ink2)}
.app{display:flex;min-height:100%}
nav.side{width:236px;flex-shrink:0;background:var(--nav);padding:24px 16px;display:flex;flex-direction:column;gap:2px;position:sticky;top:0;height:100vh;overflow:auto}
.brand{font-family:Unbounded,Onest,sans-serif;font-size:19px;font-weight:600;color:#F6F4F0;margin:0 12px 18px}
.brand i{font-style:normal;color:#E86FA3}
.nv{display:flex;justify-content:space-between;align-items:center;padding:10px 12px;border-radius:10px;color:var(--nav-ink);background:none;border:0;text-align:left;cursor:pointer;width:100%}
.nv:hover{color:#fff}
.nv.on{background:var(--nav-active);color:#fff;font-weight:600}
.nv .n{font-size:12px;color:var(--nav-muted)}
.nvs{margin:14px 12px 4px;font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--nav-muted)}
.topbar{display:none}
main{flex:1;min-width:0;padding-block:28px 60px;padding-inline:clamp(16px,3.5vw,44px);display:flex;flex-direction:column;gap:22px}
.head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap}
.head .sub{margin-top:6px;color:var(--ink2);max-width:70ch}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.btn{border:1px solid var(--line);background:var(--surface);padding:9px 14px;border-radius:10px;cursor:pointer;font-weight:500}
.btn:hover{border-color:var(--accent)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:6px;cursor:pointer;text-align:left}
.tile:hover{border-color:var(--accent)}
.tile .v{font-family:Unbounded,Onest,sans-serif;font-size:28px;font-weight:600;line-height:1}
.tile .t{font-weight:600}
.tile .s{font-size:13px;color:var(--ink2)}
.tile.warn{background:var(--warn-bg);border-color:transparent}
.tile.warn .v{color:var(--warn)}
.tile.sel{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px}
.cats{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px}
.cat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;cursor:pointer;text-align:left;font-weight:600;display:flex;justify-content:space-between;gap:8px}
.cat:hover{border-color:var(--accent);color:var(--accent-ink)}
.seg{display:inline-flex;background:var(--surface2);border-radius:10px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:none;padding:7px 12px;border-radius:8px;cursor:pointer;color:var(--ink2);font-weight:500}
.seg button.on{background:var(--surface);color:var(--ink);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.chip{display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border-radius:999px;font-size:12.5px;border:1px solid var(--line);background:var(--surface);cursor:pointer}
.chip.on{background:var(--accent);border-color:var(--accent);color:#fff}
.search{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 12px;min-width:0;width:260px;max-width:100%;color:var(--ink)}
.tablewrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:16px}
table{border-collapse:collapse;width:100%;min-width:900px}
th{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--ink2);text-align:left;padding:11px 14px;background:var(--surface2);white-space:nowrap}
td{padding:11px 14px;border-top:1px solid var(--line2);vertical-align:top;font-size:14px}
tr.click{cursor:pointer}
tr.click:hover td{background:var(--surface2)}
tr.grp td{background:var(--bg);font-weight:700;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink2);padding:9px 14px}
.id{font-size:12px;color:var(--ink3)}
.tt{font-weight:600}
.tg{display:inline-block;font-size:12px;padding:2px 8px;border-radius:6px;background:var(--surface2);margin:1px 2px 1px 0;white-space:nowrap}
.tg.m{background:var(--accent-soft);color:var(--accent-ink)}
.st{display:inline-block;font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px;white-space:nowrap}
.s1{background:var(--surface2);color:var(--ink2)}.s2{background:var(--info-bg);color:var(--info)}.s3{background:var(--warn-bg);color:var(--warn)}.s4{background:var(--ok-bg);color:var(--ok)}
.bad{color:var(--bad);font-weight:600}
.empty{padding:30px;text-align:center;color:var(--ink2)}
.card{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:20px;align-items:start}
.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:1px;background:var(--line2);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.f{background:var(--surface);padding:12px 14px;display:flex;flex-direction:column;gap:5px}
.f select,.f input,.f textarea{border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:8px;padding:7px 9px;font:inherit;width:100%}
.f .by{font-size:11.5px;color:var(--ink3)}
.side-sec{display:flex;flex-direction:column;gap:10px}
.dark{background:var(--nav);color:#F6F4F0;border-radius:16px;padding:18px;display:flex;flex-direction:column;gap:12px}
.dark .lbl{color:#CFCAC2}
.dark .btn{background:transparent;border-color:#5E5B57;color:#fff}
.dark .btn.pri{background:var(--accent);border-color:var(--accent)}
.hist{font-size:13px;color:var(--ink2);display:flex;flex-direction:column;gap:6px;max-height:260px;overflow:auto}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:600;z-index:50}
.cfm-ov{position:fixed;inset:0;background:rgba(26,26,31,.55);display:flex;align-items:center;justify-content:center;z-index:100;padding:20px}
.cfm-box{background:var(--surface);color:var(--ink);border-radius:16px;padding:22px;max-width:420px;width:100%;box-shadow:0 24px 70px rgba(0,0,0,.35)}
.cfm-box h3{margin:0 0 8px;font-family:Unbounded,sans-serif;font-size:17px}
.cfm-msg{font-size:14.5px;line-height:1.5;color:var(--ink2)}
.back{background:none;border:0;color:var(--ink2);cursor:pointer;padding:0;font-size:14px;align-self:flex-start}
.idrow{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.idchip{background:var(--ink);color:var(--bg);font-weight:700;font-size:12px;padding:5px 10px;border-radius:8px;letter-spacing:.02em}
.catchip{background:var(--accent);color:#fff;font-weight:600;font-size:13px;padding:5px 11px;border-radius:8px;border:0;cursor:pointer}
.dirchip{background:var(--accent-soft);color:var(--accent-ink);font-weight:600;font-size:13px;padding:5px 11px;border-radius:8px}
.banner{background:var(--warn-bg);border:1px solid var(--warn);border-radius:14px;padding:16px 18px;display:flex;flex-direction:column;gap:10px;color:var(--ink)}
.banner h2{color:var(--warn)}
@media (max-width:980px){.card{grid-template-columns:1fr}}
@media (max-width:860px){
  .app{flex-direction:column}
  nav.side{display:none;position:fixed;inset:0;width:auto;height:100%;z-index:40;padding-top:calc(20px + env(safe-area-inset-top,0px))}
  nav.side.open{display:flex}
  .topbar{display:flex;justify-content:space-between;align-items:center;background:var(--nav);color:#fff;padding:12px 16px;padding-top:calc(12px + env(safe-area-inset-top,0px));position:sticky;top:0;z-index:30}
  .topbar .brand{margin:0;font-size:16px}
  .topbar button{background:var(--nav-active);border:0;color:#fff;border-radius:8px;padding:8px 12px;cursor:pointer}
  .search{width:100%}
}
#login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
#login .box{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:28px;width:100%;max-width:360px;display:flex;flex-direction:column;gap:12px}
#login input{border:1px solid var(--line);background:var(--bg);border-radius:9px;padding:10px 12px;font:inherit}
#login .err{color:var(--bad);font-size:13.5px;min-height:1em}
</style>
</head>
<body>

<div id="login" hidden>
  <div class="box">
    <div class="brand" style="color:var(--ink)">афиша<i>.</i>data</div>
    <div class="muted" style="font-size:14px">Общая база. Войдите под рабочим логином.</div>
    <input id="li_email" type="email" placeholder="почта" autocomplete="username">
    <input id="li_pass" type="password" placeholder="пароль" autocomplete="current-password">
    <button class="btn pri" id="li_go" type="button">Войти</button>
    <div class="err" id="li_err"></div>
  </div>
</div>

<div class="topbar" id="topbar" hidden><div class="brand">афиша<i>.</i>data</div><button id="menuBtn" type="button">Меню</button></div>
<div class="app" id="app" hidden>
  <nav class="side" id="nav" aria-label="Разделы"></nav>
  <main id="main"><div class="empty">Загружаю базу…</div></main>
</div>
<div class="toast" id="toast" hidden></div>

<script>
const SUPA_URL="https://quzgkhzkrhdlyztzbgcc.supabase.co";
const SUPA_KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InF1emdraHprcmhkbHl6dHpiZ2NjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk2OTk1NzIsImV4cCI6MjEwNTI3NTU3Mn0.zA6OVgFkgUgXGwLTzgL9IdB7yMcRNJEIWWq-ZZGYACQ";
const sb=window.supabase.createClient(SUPA_URL,SUPA_KEY,{auth:{persistSession:true,autoRefreshToken:true}});

const MOODS=[["MUSIC","Музыка","Мелодии и ритмы"],["MEGAPOLIS","Мегаполис","Мегаполис"],["ADRENALINE","Адреналин","Адреналин"],["FEEL_GOOD","Feel good","Feel good"],["WELLNESS","Wellness","Wellness"],["NIGHT_LIFE","Night Life","Огни ночного города"],["CULTURE","Культура","Культурный код"],["HANDMADE","Handmade","Сделай сам"],["LUXE","Luxe","Luxe"],["ROMANCE","Романтика","Романтика"],["GOURMET","ГурмЭ","ГурмЭ"],["NEAR_CITY","Вокруг города","Вокруг Алматы"],["SHOPPING","Шопинг","Шопинг"]];
const MOOD=Object.fromEntries(MOODS.map(m=>[m[0],m]));
const FW=["Один","На двоих","С друзьями","С семьёй"];
const STAGES={1:"Новые от робота",2:"Исправлено AI",3:"Нужен человек",4:"В базе"};
const STAGE_TXT={1:"Робот создал запись и разметил её. AI ещё не проверял.",2:"AI нашёл неточность, исправил по первоисточнику и принял.",3:"AI не уверен или нашёл противоречие. Решает человек.",4:"Запись принята в базу."};

let CATS=[],EVENT_TYPES=[],PLACE_TYPES=[],SESS={},PLACE_OF={},EV=[],PL=[],SR=[],CFG=[];
let ME=null;
let S={view:"home",arg:null,evMode:"base",evF:{},plF:{},q:"",qtab:3,srT:null};
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const TZ="Asia/Almaty";
const dayKey=d=>new Intl.DateTimeFormat("en-CA",{timeZone:TZ,year:"numeric",month:"2-digit",day:"2-digit"}).format(d);
const fmtD=iso=>iso?new Intl.DateTimeFormat("ru-RU",{timeZone:TZ,day:"numeric",month:"short"}).format(new Date(iso)).replace(".",""):"—";
const fmtT=iso=>iso?new Intl.DateTimeFormat("ru-RU",{timeZone:TZ,hour:"2-digit",minute:"2-digit"}).format(new Date(iso)):"";
const fmtDT=iso=>iso?fmtD(iso)+", "+fmtT(iso):"—";
const money=n=>n==null?null:Number(n).toLocaleString("ru-RU").replace(/,/g," ")+" ₸";
function toast(t){const el=$("#toast");el.textContent=t;el.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>el.hidden=true,2400)}
function appConfirm(title,msg,okLabel){
  return new Promise(res=>{
    const ov=document.createElement("div");ov.className="cfm-ov";
    ov.innerHTML=`<div class="cfm-box"><h3>${esc(title)}</h3><div class="cfm-msg">${esc(msg)}</div><div class="row" style="justify-content:flex-end;gap:8px;margin-top:18px"><button class="btn" data-cfm="0">Отмена</button><button class="btn pri" data-cfm="1">${esc(okLabel||"Подтвердить")}</button></div></div>`;
    document.body.appendChild(ov);
    ov.addEventListener("click",e=>{
      if(e.target===ov){document.body.removeChild(ov);res(false);return}
      const b=e.target.closest("[data-cfm]");if(!b)return;
      document.body.removeChild(ov);res(b.dataset.cfm==="1");
    });
  });
}

function catName(id){return (CATS.find(c=>c.id===id)||{}).name||""}
function catIdByName(n){return (CATS.find(c=>c.name===n)||{}).id||null}
function startOf(ev){const s=SESS[ev.id];if(!s||!s.length)return null;return s.slice().sort((a,b)=>a.starts_at.localeCompare(b.starts_at))[0]}
function priceTxt(e){if(e.is_free)return"бесплатно";if(e.price_from==null)return"не указана";return "от "+money(e.price_from)+(e.price_to!=null?" · до "+money(e.price_to):"")}
function priceBand(e){if(e.is_free)return"Бесплатно";if(e.price_from==null)return"Не указана";if(e.price_from<10000)return"До 10 000 ₸";if(e.price_from<30000)return"10–30 000 ₸";return"От 30 000 ₸"}
const BANDS=["Бесплатно","До 10 000 ₸","10–30 000 ₸","От 30 000 ₸","Не указана"];
function isArchived(e){if(e.status==="archived"||e.status==="cancelled")return true;const s=startOf(e);const end=s&&s.ends_at?s.ends_at:(s?s.starts_at:null);if(!end)return false;return new Date(end).getTime()<Date.now()}
const active=()=>EV.filter(e=>!isArchived(e));
const inBase=e=>!isArchived(e)&&(e.pipeline_stage===2||e.pipeline_stage===4);
const waiting=e=>!isArchived(e)&&(e.pipeline_stage===1||e.pipeline_stage===3);
const placeById=id=>PL.find(p=>p.id===id);
function issues(e){const r=[];if(!PLACE_OF[e.id]&&!e.meeting_point)r.push("noplace");if(e.price_from==null&&!e.is_free)r.push("noprice");if(!e.moods||!e.moods.length)r.push("nomood");if(!e.for_whom||!e.for_whom.length)r.push("nofw");return r}
const ISSUES={noplace:"Без места или точки сбора",noprice:"Без цены",nomood:"Без настроения",nofw:"Без «Для кого»"};

function go(view,arg,patch){S.view=view;S.arg=arg??null;if(patch)Object.assign(S,patch);$("#nav").classList.remove("open");render();window.scrollTo(0,0)}
function navHtml(){const a=active();const n3=EV.filter(e=>e.pipeline_stage===3&&!isArchived(e)).length;const it=(v,t,n)=>`<button class="nv${S.view===v||(v==="events"&&S.view==="event")||(v==="places"&&S.view==="place")?" on":""}" data-go="${v}">${t}${n!=null?`<span class="n">${n}</span>`:""}</button>`;
return `<div class="brand">афиша<i>.</i>data</div>${it("home","Главная")}<div class="nvs">Реестры</div>${it("events","События",a.length)}${it("places","Места",PL.length)}<div class="nvs">Работа</div>${it("queue","Конвейер проверки",n3)}${it("sources","Источники",SR.length)}<div class="nvs" style="margin-top:auto"></div><button class="nv" id="logoutBtn">Выйти (${esc(ME||"")})</button>`}

function render(){
  $("#nav").innerHTML=navHtml();
  $("#logoutBtn").addEventListener("click",()=>sb.auth.signOut());
  const m=$("#main");
  const V={home,events,places,category,event:eventCard,place:placeCard,queue,sources}[S.view]||home;
  m.innerHTML=V(S.arg);
}

function home(){
  const a=active(),arch=EV.length-a.length;
  const st=k=>active().filter(e=>e.pipeline_stage===k).length;
  const plNoAddr=PL.filter(p=>!p.address).length;
  const q=Object.keys(ISSUES).map(k=>[k,a.filter(e=>issues(e).includes(k)).length]);
  return `<div class="head"><div><div class="lbl">Алматы</div><h1>Главная</h1><div class="sub">Все события и места города. Каждая цифра открывает список.</div></div></div>
  <section class="grid2">
   <div class="panel" style="display:flex;flex-direction:column;gap:12px"><div class="row" style="justify-content:space-between"><h2>События</h2><a href="#" data-go="events">Реестр →</a></div><div class="tiles">
    ${tile(a.length,"Собрано","предстоящие","events",{evMode:"active",evF:{}})}${tile(EV.filter(inBase).length,"В базе","прошли проверку","events",{evMode:"base",evF:{}})}${tile(EV.filter(waiting).length,"Ждут человека","ещё не в базе","events",{evMode:"wait",evF:{}},EV.filter(waiting).length?"warn":"")}${tile(arch,"Архив","прошедшие","events",{evMode:"archive",evF:{}})}</div></div>
   <div class="panel" style="display:flex;flex-direction:column;gap:12px"><div class="row" style="justify-content:space-between"><h2>Места</h2><a href="#" data-go="places">Реестр →</a></div><div class="tiles">
    ${tile(PL.length,"Всего","","places",{plF:{}})}${tile(PL.filter(p=>p.status==="active").length,"Активные","","places",{plF:{}})}${tile(PL.filter(p=>p.is_showcase).length,"На витрине","","places",{plF:{showcase:1}})}${tile(plNoAddr,"Без адреса","","places",{plF:{noaddr:1}})}</div></div>
  </section>
  <section style="display:flex;flex-direction:column;gap:12px"><div class="lbl">Конвейер проверки</div><div class="tiles">
    ${tile(st(1),"Новые от робота","ждут AI","queue",{qtab:1})}${tile(st(2),"Исправлено AI","AI поправил и принял","queue",{qtab:2})}${tile(st(3),"Нужен человек","решаете вы","queue",{qtab:3},st(3)?"warn":"")}${tile(st(4),"В базе","стадия 4","queue",{qtab:4})}</div></section>
  <section style="display:flex;flex-direction:column;gap:12px"><div class="lbl">15 категорий досуга</div>
   <div class="cats">${CATS.map(c=>`<button class="cat" data-go="category" data-arg="${esc(c.id)}"><span>${esc(c.name)}</span><span class="muted">→</span></button>`).join("")}</div></section>
  <section class="panel" style="display:flex;flex-direction:column;gap:12px"><h2>Качество данных</h2><div class="muted" style="font-size:14px">По действующим событиям. Клик открывает записи с проблемой.</div>
   <div class="tiles">${q.map(([k,n])=>`<button class="tile${n?" warn":""}" data-go="events" data-patch='${esc(JSON.stringify({evMode:"active",evF:{issue:k}}))}'><span class="v">${n}</span><span class="s">${ISSUES[k]}</span></button>`).join("")}</div></section>`;
}

  const t=S.qtab;const L=active().filter(e=>e.pipeline_stage===t).sort((a,b)=>((startOf(a)||{}).starts_at||"").localeCompare((startOf(b)||{}).starts_at||""));

const GROUP_LBL={social_network:"Соцсети",ticket_platform:"Билетные платформы",city_media:"Агрегаторы и медиа",official_site:"Официальные источники",industry_site:"Отраслевые сайты",map:"Карты",catalog:"Каталоги",eventer_database:"Eventer Data Base"};
function guessGroup(host){if(/facebook|tiktok|vk\.com|youtube|threads|instagram/.test(host))return"social_network";if(/ticketon|kino\.kz|afisha\.yandex|topbilet|kassir|biletix|tickets/.test(host))return"ticket_platform";if(/sxodim|inalmaty|afisha|kudago|gorodzovet/.test(host))return"city_media";if(/gov\.kz|akimat/.test(host))return"official_site";if(/2gis|maps\.google/.test(host))return"map";return"city_media"}
function parseSourceLine(line){
  let raw=line.trim().replace(/[,;]+$/,"");if(!raw)return null;
  let url=raw,name;
  const ig=raw.match(/^@([A-Za-z0-9._]{2,})$/)||raw.match(/instagram\.com\/([A-Za-z0-9._]+)/i);
  const tg=raw.match(/(?:t\.me|telegram\.me)\/([A-Za-z0-9_]+)/i);
  let channel="website";
  if(ig){name="@"+ig[1];url="https://instagram.com/"+ig[1];channel="instagram"}
  else if(tg){name="@"+tg[1];url="https://t.me/"+tg[1];channel="telegram"}
  else{if(!/^https?:\/\//i.test(url))url="https://"+url;let host="";try{host=new URL(url).hostname.replace(/^www\./,"")}catch(e){return {bad:true,url:raw}}name=host}
  const host=(()=>{try{return new URL(url).hostname.replace(/^www\./,"")}catch(e){return name}})();
  const group=channel==="instagram"?"social_network":channel==="telegram"?"social_network":guessGroup(host);
  const norm=url.toLowerCase().replace(/^https?:\/\/(www\.)?/,"").replace(/\/+$/,"");
  const dup=SR.some(s=>s.url&&s.url.toLowerCase().replace(/^https?:\/\/(www\.)?/,"").replace(/\/+$/,"")===norm);
  return {url,name,channel,group,dup};
}
async function addSources(){
  const txt=($("#src_in")||{}).value||"";
  const items=txt.split(/\n+/).map(parseSourceLine).filter(Boolean);
  if(!items.length){toast("Вставьте ссылку или @ник");return}
  const bad=items.filter(x=>x.bad);if(bad.length){toast("Не похоже на ссылку: "+bad[0].url);return}
  const fresh=items.filter(x=>!x.dup);
  if(!fresh.length){toast("Эти источники уже есть в базе");return}
  try{
    for(const x of fresh){
      const {data,error}=await sb.from("sources").insert({name:x.name,url:x.url,source_group:x.group,channel:x.channel,is_connected:false,is_active:true}).select().single();
      if(error)throw error;
      await sb.from("parser_source_configurations").insert({source_id:data.id,status:"ready",collection_mode:"manual_review",cadence:"daily",entity_scope:["event"]});
    }
    $("#src_in").value="";
    await loadSources();render();
    toast("Добавлено: "+fresh.length+(items.length>fresh.length?", дубли пропущены: "+(items.length-fresh.length):""));
  }catch(err){toast("Не сохранилось: "+(err.message||"ошибка"))}
}
function sources(){
  const L=SR.filter(s=>!S.srT||s.source_group===S.srT).sort((a,b)=>a.name.localeCompare(b.name,"ru"));
  const groups=[...new Set(SR.map(s=>s.source_group))];
  let rows="",g="";
  for(const s of L){if(s.source_group!==g){g=s.source_group;rows+=`<tr class="grp"><td colspan="5">${esc(GROUP_LBL[g]||g)}</td></tr>`}
    const cfg=CFG.find(c=>c.source_id===s.id);
    rows+=`<tr><td><div class="tt">${esc(s.name)}</div><a class="id" href="${esc(s.url)}" target="_blank" rel="noopener" style="color:var(--accent)">${esc(s.url.replace(/^https?:\/\//,""))}</a></td><td>${esc(s.channel||"")}</td><td><span class="st ${s.is_connected?"s4":"s1"}">${s.is_connected?"подключён":"не подключён"}</span></td><td>${cfg?esc(cfg.status):""}</td><td><button class="chip" data-srcst="${s.id}">${s.is_connected?"Отключить":"Подключить"}</button> <button class="chip" data-srcdel="${s.id}">${S.srDel===s.id?"Точно удалить?":"Удалить"}</button></td></tr>`}
  const on=SR.filter(s=>s.is_connected).length;
  return `<div class="head"><div><div class="lbl">Работа</div><h1>Источники</h1><div class="sub">Откуда база берёт события и места.</div></div></div>
  <div class="tiles"><button class="tile${!S.srT?" sel":""}" data-srt=""><span class="v">${SR.length}</span><span class="t">Всего источников</span><span class="s">подключено: ${on}</span></button>${groups.map(gr=>`<button class="tile${S.srT===gr?" sel":""}" data-srt="${esc(gr)}"><span class="v">${SR.filter(s=>s.source_group===gr).length}</span><span class="t">${esc(GROUP_LBL[gr]||gr)}</span></button>`).join("")}</div>
  <section class="panel" style="display:flex;flex-direction:column;gap:12px"><h2>Добавить источники</h2>
   <textarea id="src_in" rows="4" style="width:100%;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:10px;padding:10px 12px;font:inherit" placeholder="https://instagram.com/jazzestate&#10;@almaty_afisha&#10;https://t.me/almatyevents"></textarea>
   <div class="row"><button class="btn pri" data-srcadd="1" type="button">Добавить в базу</button></div>
  </section>
  <div class="tablewrap"><table><thead><tr><th>Источник</th><th>Канал</th><th>Подключён</th><th>Статус сбора</th><th></th></tr></thead><tbody>${rows||`<tr><td colspan="5"><div class="empty">Источники загружаются…</div></td></tr>`}</tbody></table></div>`;
}

async function recordHistory(entity_type,entity_id,field_name,old_value,new_value){
  try{await sb.from("record_history").insert({entity_type,entity_id,field_name,old_value,new_value,changed_by:ME||"human"})}catch(e){}
}
async function saveEvent(id,extra){
  const e=EV.find(x=>x.id===id);if(!e)return;
  const wasWaiting=e.pipeline_stage===1||e.pipeline_stage===3;
  const upd={};const hist=[];
  const ch=(field,from,to)=>{if(JSON.stringify(from)===JSON.stringify(to===undefined?from:to))return;upd[field]=to;hist.push([field,from,to])};
  if(extra){Object.entries(extra).forEach(([k,v])=>ch(k,e[k],v))}
  else{
    const v=s=>{const el=$(s);return el?el.value:null};
    ch("leisure_category_id",e.leisure_category_id,catIdByName(v("#f_cat"))||e.leisure_category_id);
    ch("event_category",e.event_category,v("#f_type")||null);
    ch("genre",e.genre,v("#f_genre")||null);
    ch("age_restriction",e.age_restriction,v("#f_age")||null);
    ch("meeting_point",e.meeting_point,v("#f_meet")||null);
    ch("booking_url",e.booking_url,v("#f_booking")||null);
    const free=v("#f_free")==="1";ch("is_free",e.is_free,free);
    const pf=v("#f_pfrom");ch("price_from",e.price_from,pf===""?null:Number(pf));
    const moods=window.__moodOrder||(e.moods||[]);ch("moods",e.moods||[],moods);if(JSON.stringify(moods)!==JSON.stringify(e.moods||[]))upd.mood_main=moods[0]||null;
    const fw=[...document.querySelectorAll("#f_fw .chip.on")].map(b=>b.dataset.fw);ch("for_whom",e.for_whom||[],fw);
    // date/place/stage handled on save via extra calls below
  }
  if(!extra){
    const st=$("#f_start")?$("#f_start").value:null;
    if(st){
      const iso=new Date(st+":00+05:00").toISOString();
      const cur=startOf(e);
      if(!cur||new Date(iso).getTime()!==new Date(cur.starts_at).getTime()){
        if(cur){await sb.from("event_sessions").update({starts_at:iso}).eq("id",cur.id)}
        else{await sb.from("event_sessions").insert({event_id:e.id,starts_at:iso})}
      }
    }
    const pn=$("#f_place")?$("#f_place").value:null;
    const curPlace=PLACE_OF[e.id];const newPlace=PL.find(p=>p.name===pn);
    if((curPlace?curPlace.id:null)!==(newPlace?newPlace.id:null)){
      if(curPlace)await sb.from("event_places").delete().eq("event_id",e.id).eq("place_id",curPlace.id);
      if(newPlace)await sb.from("event_places").insert({event_id:e.id,place_id:newPlace.id,relation_type:"venue"});
    }
    if(upd.pipeline_stage===undefined && e.pipeline_stage!==4 && Object.keys(upd).length){upd.pipeline_stage=4;upd.stage_reason=null}
  }
  {const finalStage=upd.pipeline_stage!==undefined?upd.pipeline_stage:e.pipeline_stage;const wantPfx=(finalStage===1||finalStage===3)?"AFC-":"AFB-";if(e.public_id&&e.public_id.slice(0,4)!==wantPfx){upd.public_id=wantPfx+e.public_id.slice(4)}}
  upd.human_updated_at=new Date().toISOString();upd.human_updated_by=ME||"human";
  if(!Object.keys(upd).length){toast("Изменений нет");return}
  try{
    const {error}=await sb.from("events").update(upd).eq("id",id);
    if(error)throw error;
    for(const [field,from,to] of hist)await recordHistory("event",id,field,from,to);
    await loadEvents();
    if(wasWaiting){S.view="events";S.evMode="wait";S.evF={};render();toast("Сохранено · вернул в очередь «Ждут человека»")}
    else{render();toast("Сохранено")}
  }catch(err){toast("Не сохранилось: "+(err.message||"ошибка"))}
}
async function savePlace(id){
  const p=placeById(id);if(!p)return;
  const nv=$("#p_type")?$("#p_type").value:null;
  if(!nv||nv===p.place_type){toast("Изменений нет");return}
  try{
    const {error}=await sb.from("places").update({place_type:nv,human_updated_at:new Date().toISOString(),human_updated_by:ME||"human"}).eq("id",id);
    if(error)throw error;
    await recordHistory("place",id,"place_type",p.place_type,nv);
    await loadPlaces();render();
    toast("Тип сохранён");
  }catch(err){toast("Не сохранилось: "+(err.message||"ошибка"))}
}

document.addEventListener("click",ev=>{
  const t=ev.target.closest("[data-psave],[data-srcadd],[data-srcst],[data-srcdel],[data-srt],[data-go],[data-pl],[data-f],[data-clear],[data-pclear],[data-qtab],[data-save],[data-stage],[data-archive],[data-2place],[data-mood],[data-fw]");
  if(!t)return;
  if(t.dataset.psave){savePlace(t.dataset.psave);return}
  if(t.dataset.srcadd){addSources();return}
  if(t.dataset.srcst){const x=SR.find(s=>s.id===t.dataset.srcst);if(x)sb.from("sources").update({is_connected:!x.is_connected}).eq("id",x.id).then(async()=>{await loadSources();render();toast("Статус изменён")});return}
  if(t.dataset.srcdel){const id=t.dataset.srcdel;if(S.srDel!==id){S.srDel=id;render();return}S.srDel=null;
    sb.from("parser_source_configurations").delete().eq("source_id",id).then(()=>sb.from("sources").delete().eq("id",id)).then(async()=>{await loadSources();render();toast("Источник удалён")});return}
  if(t.dataset.srt!==undefined){ev.preventDefault();S.srT=t.dataset.srt||null;render();return}
  if(t.dataset.mood){ev.preventDefault();const on=[...document.querySelectorAll("#f_moods .chip.on")];window.__moodOrder=window.__moodOrder||on.map(b=>b.dataset.mood);if(t.classList.contains("on")){t.classList.remove("on");window.__moodOrder=window.__moodOrder.filter(m=>m!==t.dataset.mood)}else{if(on.length>=3){toast("Не больше трёх настроений");return}t.classList.add("on");window.__moodOrder.push(t.dataset.mood)}document.querySelectorAll("#f_moods .chip").forEach(b=>{b.textContent=(window.__moodOrder[0]===b.dataset.mood?"★ ":"")+MOOD[b.dataset.mood][2]});return}
  if(t.dataset.fw){ev.preventDefault();t.classList.toggle("on");return}
  if(t.dataset.save){window.__moodOrder=null;saveEvent(t.dataset.save);return}
  if(t.dataset.stage){const k=Number(t.dataset.stage);saveEvent(t.dataset.id,{pipeline_stage:k,stage_reason:k===4?null:"Возвращено на проверку AI"});return}
  if(t.dataset.archive){saveEvent(t.dataset.archive,{status:"archived"});return}
  if(t.dataset["2place"]){convertEventToPlace(t.dataset["2place"]);return}
  ev.preventDefault();
  if(t.dataset.pl){S.plF=JSON.parse(t.dataset.pl);render();return}
  if(t.dataset.f){const k=t.dataset.f,v=t.dataset.v;if(k==="pcat"){}else{S.evF=Object.assign({},S.evF,{[k]:S.evF[k]===v?null:v})}render();return}
  if(t.dataset.clear){S.evF=Object.assign({},S.evF,{[t.dataset.clear]:null});render();return}
  if(t.dataset.pclear){S.plF=Object.assign({},S.plF,{[t.dataset.pclear]:null});render();return}
  if(t.dataset.qtab){S.qtab=Number(t.dataset.qtab);render();return}
  if(t.dataset.go){window.__moodOrder=null;const patch=t.dataset.patch?JSON.parse(t.dataset.patch):null;go(t.dataset.go,t.dataset.arg,patch)}
});
document.addEventListener("input",ev=>{if(ev.target.id==="q"){S.q=ev.target.value;const pos=ev.target.selectionStart;render();const q=$("#q");if(q){q.focus();q.setSelectionRange(pos,pos)}}});

async function loadCats(){const {data}=await sb.from("leisure_categories").select("id,name,sort_order").order("sort_order");CATS=data||[]}
async function loadEvents(){
  const {data:ev}=await sb.from("events").select("*").order("created_at");EV=ev||[];
  const {data:sess}=await sb.from("event_sessions").select("*");SESS={};(sess||[]).forEach(s=>{(SESS[s.event_id]=SESS[s.event_id]||[]).push(s)});
  const {data:ep}=await sb.from("event_places").select("event_id,place_id,relation_type").eq("relation_type","venue");PLACE_OF={};(ep||[]).forEach(r=>{PLACE_OF[r.event_id]={id:r.place_id}});
}
async function loadPlaces(){const {data}=await sb.from("places").select("*").order("name");PL=data||[]}
async function loadSources(){
  const {data:sr}=await sb.from("sources").select("*").order("name");SR=sr||[];
  const {data:cfg}=await sb.from("parser_source_configurations").select("*");CFG=cfg||[];
}
async function loadAll(first){
  if(first)$("#main").innerHTML=`<div class="empty">Загружаю базу…</div>`;
  await Promise.all([loadCats(),loadEvents(),loadPlaces(),loadSources()]);
  render();
}

$("#menuBtn")&&$("#menuBtn").addEventListener("click",()=>$("#nav").classList.toggle("open"));

  $("#li_err").textContent="";
  const email=$("#li_email").value.trim(),pass=$("#li_pass").value;
  if(!email||!pass){$("#li_err").textContent="Введите почту и пароль";return}
  const {error}=await sb.auth.signInWithPassword({email,password:pass});
  if(error)$("#li_err").textContent="Не удалось войти: "+error.message;
});
$("#li_pass").addEventListener("keydown",e=>{if(e.key==="Enter")$("#li_go").click()});

let authInited=false,pollId=null;
sb.auth.onAuthStateChange((event,session)=>{
  if(session&&session.user){
    ME=session.user.email;
    $("#login").hidden=true;$("#app").hidden=false;$("#topbar").hidden=false;
    if(!authInited){
      authInited=true;
      loadAll(true);
      pollId=setInterval(async()=>{try{await loadAll(false)}catch(e){}},45000);
    }
  }else{
    authInited=false;
    if(pollId){clearInterval(pollId);pollId=null}
    $("#login").hidden=false;$("#app").hidden=true;$("#topbar").hidden=true;
  }
});
</script>
