<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Reels — согласование</title>
<style>
:root{--bg:#f6f4f5;--card:#fff;--ink:#1c1b1d;--ink2:#6b6870;--line:#e6e1e4;--accent:#c0127f;--accent2:#8f07a6;--ok:#1e7a48;--bad:#b00020}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
main{max-width:520px;margin:0 auto;padding:20px 16px 40px}
h1{font-size:22px;margin:0 0 4px}
.sub{color:var(--ink2);margin:0 0 14px;font-size:14px}
.meta{display:flex;justify-content:space-between;color:var(--ink2);font-size:13px;margin-bottom:8px}
.player{position:relative;background:#000;border-radius:18px;overflow:hidden;aspect-ratio:9/16;max-height:70vh;margin:0 auto}
.player video{width:100%;height:100%;object-fit:contain;display:block}
.sound{position:absolute;right:10px;bottom:10px;background:rgba(0,0,0,.55);color:#fff;border:0;border-radius:20px;padding:6px 12px;font:inherit;font-size:13px}
.info{background:var(--card);border-radius:16px;padding:12px 14px;margin-top:10px}
.info b{display:block}
.info p{margin:6px 0 0;color:var(--ink2);font-size:13px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.info a{color:var(--accent);font-size:13px}
label{display:block;margin-top:12px;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink2)}
select{width:100%;margin-top:6px;border:1px solid var(--line);border-radius:12px;padding:10px;font:inherit;background:var(--card)}
.row{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.chip{border:1px solid var(--line);background:var(--card);border-radius:20px;padding:6px 12px;font-size:13px;cursor:pointer}
.chip.on{background:#fce4f3;border-color:var(--accent);color:var(--accent2)}
.acts{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:14px}
.acts button{border:0;border-radius:14px;padding:14px 6px;font:inherit;font-weight:700;cursor:pointer}
.yes{background:linear-gradient(90deg,var(--accent),var(--accent2));color:#fff}
.no{background:var(--card);border:1px solid var(--line)!important;color:var(--ink)}
.style{background:var(--card);border:1px solid var(--line)!important;color:var(--accent2)}
.acts button:disabled{opacity:.4}
.msg{background:var(--card);border-radius:16px;padding:20px;margin-top:12px}
.msg a{color:var(--accent)}
.evbox{background:#fce4f3;border-radius:16px;padding:12px 14px;margin-top:10px;display:flex;flex-direction:column;gap:2px}
.evbox span{font-size:12px;color:var(--ink2)}
.evbox b{font-size:16px}
.evbox small{font-size:12px;color:var(--accent2);margin-top:4px}
.evchange{margin-top:8px;font-size:13px;color:var(--ink2)}
.evchange select{margin-top:6px}
.err{color:var(--bad);font-size:13px;margin-top:8px;min-height:18px}
</style>
</head>
<body>
<main>
  <a href="../soglasovanie/" style="color:#c0127f;text-decoration:none;font-size:14px;display:inline-block;padding:6px 0">← Согласование</a>
  <h1>Reels — согласование</h1>
  <p class="sub">В «Чем заняться» попадают только Reels, которые здесь получили «Да». Смотрим по «Эстетике Афиши»: свет, цвет, кадр, настроение.</p>
  <div id="app"><div class="msg">Загружаю…</div></div>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
const SUPA_URL="https://quzgkhzkrhdlyztzbgcc.supabase.co";
const SUPA_KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InF1emdraHprcmhkbHl6dHpiZ2NjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk2OTk1NzIsImV4cCI6MjEwNTI3NTU3Mn0.zA6OVgFkgUgXGwLTzgL9IdB7yMcRNJEIWWq-ZZGYACQ";
const sb=supabase.createClient(SUPA_URL,SUPA_KEY,{auth:{persistSession:true,autoRefreshToken:true}});
const FILES=SUPA_URL+"/storage/v1/object/public/reels/";
const WHY=["Свет","Цвет","Живые люди","Атмосфера","Стильно","Темно","Дёшево смотрится","Много текста","Плохое качество","Скучно","Не про событие"];
const app=document.getElementById("app");
let items=[],events={},i=0,why=new Set();
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmt=d=>new Date(d).toLocaleString("ru-RU",{day:"numeric",month:"short",hour:"2-digit",minute:"2-digit",timeZone:"Asia/Almaty"});

async function start(){
  const {data:{session}}=await sb.auth.getSession();
  if(!session){app.innerHTML=`<div class="msg">Нужно войти в базу Афиши.<br><br><a href="../?next=soglasovanie-reels/">Войти по ссылке из письма</a> — после входа вернётесь сюда.</div>`;return}
  const email=(session.user.email||"").toLowerCase();
  const {data:role}=await sb.from("aesthetic_editors").select("role").eq("email",email).maybeSingle();
  if(!role){app.innerHTML=`<div class="msg">У аккаунта ${esc(email)} нет роли «Редактор витрины».</div>`;return}
  const [{data:q,error},{data:ev}]=await Promise.all([
    sb.from("reels_queue").select("id,account,caption,post_url,taken_at,video_path,poster_path,event_id,match_reason").eq("status","review").not("matched_at","is",null).not("event_id","is",null).order("taken_at",{ascending:false}).limit(100),
    sb.from("reels_queue_events").select("queue_id,event_id,title,date_start").order("date_start").limit(2000)
  ]);
  if(error){app.innerHTML=`<div class="msg">Не удалось загрузить очередь: ${esc(error.message)}</div>`;return}
  items=q||[];
  for(const e of ev||[])(events[e.queue_id]??=[]).push(e);
  render();
}
function render(){
  if(i>=items.length){app.innerHTML=`<div class="msg"><b>Очередь пуста.</b><br>Робот показывает только ролики, которые точно про конкретное будущее событие. Новые появляются каждое утро после сбора. <a href="" onclick="location.reload();return false">Обновить</a></div>`;return}
  const r=items[i];why=new Set();
  const opts=(events[r.id]||[]).filter((e,k,a)=>a.findIndex(x=>x.event_id===e.event_id)===k);
  app.innerHTML=`
   <div class="meta"><span>${i+1} из ${items.length}</span><span>${r.taken_at?fmt(r.taken_at):""}</span></div>
   <div class="player"><video id="v" src="${FILES+esc(r.video_path)}" ${r.poster_path?`poster="${FILES+esc(r.poster_path)}"`:""} autoplay muted loop playsinline></video><button class="sound" id="snd" type="button">Звук</button></div>
   <div class="info"><b>@${esc(r.account)}</b><p>${esc(r.caption)}</p>${r.post_url?`<a href="${esc(r.post_url)}" target="_blank" rel="noopener">Открыть в Instagram</a>`:""}</div>
   <div class="evbox" id="evbox"></div>
   <details class="evchange"><summary>Другое событие</summary><select id="ev">${opts.map(e=>`<option value="${e.event_id}" ${e.event_id===r.event_id?"selected":""}>${esc(e.title)} · ${fmt(e.date_start)}</option>`).join("")}</select></details>
   <label>Почему (необязательно)</label>
   <div class="row" id="why">${WHY.map(w=>`<button class="chip" type="button">${esc(w)}</button>`).join("")}</div>
   <div class="acts"><button class="yes" data-d="approved" type="button">Да</button><button class="no" data-d="rejected" type="button">Нет</button><button class="style" data-d="style" type="button">Не наша эстетика</button></div>
   <div class="err" id="err"></div>`;
  const evSel=document.getElementById("ev");
  const showEv=()=>{const e=opts.find(x=>x.event_id===evSel.value);document.getElementById("evbox").innerHTML=e?`<span>Ролик будет на карточке события</span><b>${esc(e.title)}</b><span>${fmt(e.date_start)}</span>${r.match_reason?`<small>Робот: ${esc(r.match_reason)}</small>`:""}`:"<b>Событие не выбрано</b>";app.querySelector(".yes").disabled=!e};
  evSel.onchange=showEv;
  const v=document.getElementById("v");
  document.getElementById("snd").onclick=()=>{v.muted=!v.muted;document.getElementById("snd").textContent=v.muted?"Звук":"Без звука";v.play()};
  app.querySelectorAll("#why .chip").forEach(c=>c.onclick=()=>{c.classList.toggle("on");c.classList.contains("on")?why.add(c.textContent):why.delete(c.textContent)});
  app.querySelectorAll(".acts button").forEach(b=>b.onclick=()=>decide(b.dataset.d));
  showEv();
}
async function decide(d){
  const r=items[i];
  app.querySelectorAll(".acts button").forEach(b=>b.disabled=true);
  const reasons=[...why];if(d==="style")reasons.unshift("Не наша эстетика");
  const ev=document.getElementById("ev").value||null;
  const {error}=await sb.rpc("reels_decide",{p_id:r.id,p_decision:d==="approved"?"approved":"rejected",p_event:ev,p_reasons:reasons,p_note:null});
  if(error){document.getElementById("err").textContent="Не сохранилось: "+error.message;app.querySelectorAll(".acts button").forEach(b=>b.disabled=false);return}
  i++;render();
}
start().catch(e=>{app.innerHTML=`<div class="msg">Сервер не ответил. <a href="" onclick="location.reload();return false">Обновить</a></div>`});
</script>
</body>
</html>
